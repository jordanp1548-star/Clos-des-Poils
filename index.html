*{box-sizing:border-box}

h2{font-size:1.55rem;margin:1.1em 0 .55em}
h3{font-size:1.15rem;margin:1.1em 0 .55em}
p{margin:.55em 0 1em}

input,select,textarea{width:100%;min-width:0}
textarea{min-height:130px;resize:vertical}
button{background:var(--g);color:#fff;border:1px solid var(--g);cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
button:hover{background:#254a36;transform:translateY(-1px)}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}
button.s:hover{background:#edf3ee}
button.d{background:#a83c35;border-color:#a83c35}
label{display:block;margin:9px 0;min-width:170px;flex:1}
label input,label select,label textarea{display:block;margin-top:5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#edf2ed;color:var(--g);font-size:.82rem;font-weight:650}
footer{text-align:center;padding:28px 16px;color:var(--mut);font-size:.9rem}
footer a{color:var(--mut);margin:0 8px}
.mut{color:var(--mut)}.err{color:#a8322a}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
summary{cursor:pointer;font-weight:650}
details[open]>summary{margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line)}
table{font-size:.94rem}th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
img{max-width:100%}
@media(max-width:650px){
  header{align-items:flex-start}
  header nav{width:100%;gap:3px}
  header a{margin:0;padding:7px 8px;font-size:.88rem}
  main{padding:15px}
  .row>*{flex:1 1 100%}
  .card{border-radius:13px}
}
@page{size:A4;margin:16mm}
@media print{
  body{background:#fff!important;color:#202820!important;font-size:10.5pt}
  header,footer,nav,button,form,.no-print,.sf,.ef,.cf,.pf,.uf,.del-photo,#df,#nu,.admin-only{display:none!important}
  main{width:100%;max-width:none;padding:0;margin:0}
  .card{border:0;box-shadow:none;border-radius:0;padding:0;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}
  details{display:block}
  details>summary{display:none}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;break-inside:avoid}
  h1,h2,h3,h4{break-after:avoid}
}

function applyDeveloperLabels(root=document){
  const labels=CFG.uiLabels||{};
  if(!Object.keys(labels).length)return;
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
  nodes.forEach(node=>{
    const original=node.nodeValue.trim();
    if(Object.prototype.hasOwnProperty.call(labels,original)){
      const leading=node.nodeValue.match(/^\s*/)?.[0]||'';
      const trailing=node.nodeValue.match(/\s*$/)?.[0]||'';
      node.nodeValue=leading+labels[original]+trailing;
    }
  });
}

document.querySelectorAll('.uf').forEach(f=>f.onsubmit=async e=>{
  e.preventDefault();
  const fileInput = f.querySelector('input[type="file"]');
  const comment = f.querySelector('input[name="comment"]').value;
  const file = fileInput.files[0];
  if(!file) return;
  
  f.querySelector('button').textContent = 'Envoi...';
  const animalId = +f.dataset.id;
  const animal = A.find(x=>x.id==animalId);
  
  const fileName = `${animalId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
  const { error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
  if(uploadError) { alert(uploadError.message); f.querySelector('button').textContent = 'Mettre en ligne'; return; }
  
  const { data: { publicUrl } } = sb.storage.from('photos').getPublicUrl(fileName);
  
  const newPhoto = { url: publicUrl, comment: comment, date: new Date().toISOString() };
  const newPhotos = animal.photos ? [...animal.photos, newPhoto] : [newPhoto];
  
  const { error: updateError } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animalId);
  if(updateError) alert(updateError.message);
  else done(animalId);
});

document.querySelectorAll('.del-photo').forEach(b=>b.onclick=async()=>{
  if(!confirm('Supprimer cette photo ?')) return;
  const animal = A.find(x=>x.id==b.dataset.animal);
  const newPhotos = [...animal.photos];
  newPhotos.splice(b.dataset.i, 1);
  
  const { error } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animal.id);
  if(error) alert(error.message);
  else done(animal.id);
});

  const o=$('#out');if(o)o.onclick=async e=>{e.preventDefault();if(closRealtime){sb.removeChannel(closRealtime);closRealtime=null}await sb.auth.signOut()};
};

const closPublicCTA=()=>`<section class="card" style="border:2px solid var(--g);background:#fff">
  <h2>Vous souhaitez accueillir l’un de nos animaux ?</h2>
  <p>Créez votre espace personnel pour échanger avec l’éleveur, poser vos questions, demander une réservation et suivre votre futur compagnon.</p>
  <div class="row"><a href="#/compte"><button type="button">Créer mon compte / Me connecter</button></a><a href="#/contact"><button type="button" class="s">Contacter l’éleveur</button></a></div>
  <p class="mut">Un compte vous permet de conserver l’historique de vos échanges et de retrouver les informations de votre réservation.</p>
</section>`;
const closOriginalHome=home;
home=async function(){await closOriginalHome();if(!me){app.insertAdjacentHTML('afterbegin',closPublicCTA());app.insertAdjacentHTML('beforeend',`<div class="card"><h3>Une question avant de vous décider ?</h3><p>L’éleveur peut vous renseigner sur le caractère, les disponibilités, les conditions d’accueil et les étapes d’une réservation.</p><a href="#/contact">Contacter Le Clos des Poils</a></div>`)}else{app.insertAdjacentHTML('beforeend','<p><a href="#/messages">Ouvrir ma messagerie</a></p>')}};

// Connexion et inscription : choix explicite, rôle attribué uniquement par un administrateur.
const closOriginalLogin=login;
login=function(sign=false){
  closOriginalLogin(sign);
  if(!sign){
    const card=app.querySelector('.card');
    if(card)card.insertAdjacentHTML('beforeend',`<hr><p><b>Vous découvrez l’élevage ?</b></p><p>Créez un compte client pour contacter l’éleveur, demander une réservation et suivre votre dossier.</p><button type="button" class="s" id="clos-register">Créer mon compte client</button><p class="mut">Les comptes vendeur, éleveur et développeur sont créés ou autorisés par l’administration. Ils ne peuvent pas être choisis librement à l’inscription.</p>`);
    const b=$('#clos-register');if(b)b.onclick=()=>login(true);
  }
};

// Pages publiques supplémentaires.
const closOriginalRoute=route;
route=function(){
  const h=location.hash.slice(2);
  if(h==='contact')return closContact();
  if(h==='faq')return closFaq();
  if(h==='messages'){if(!me){location.hash='#/compte';return}if(prof?.role==='seller')return closSellerMessages();if(closIsStaff())return closStaffMessages();return closClientMessages()}
  if(h==='vendeur'){if(me&&prof?.role==='seller')return closSeller();location.hash='#/compte';return}
  if(h==='compte'&&me&&prof?.role==='seller')return closSeller();
  return closOriginalRoute();
};
// Important : le listener hashchange initial pointait vers l'ancienne route.
// On le remplace pour que FAQ, Contact et Messagerie soient réellement routées.
removeEventListener('hashchange', closOriginalRoute);
addEventListener('hashchange', route);
function closContact(){
 app.innerHTML=`<h1>Contacter l’éleveur</h1><div class="card"><p>Une question sur un animal, une réservation ou les conditions d’accueil ? Écrivez directement à l’éleveur depuis votre espace client.</p>
 ${me?'<a href="#/messages"><button>Ouvrir la messagerie</button></a>':`<p>Pour conserver une trace de vos échanges, créez un compte ou connectez-vous avant d’envoyer votre message.</p><a href="#/compte"><button>Créer un compte / Se connecter</button></a>`}
 <hr><p><b>Contact téléphonique</b><br><a href="tel:0648774637">06 48 77 46 37</a></p><p class="mut">Les demandes envoyées depuis le site sont conservées dans votre espace personnel.</p></div>`;
}
function closFaq(){
 const rows=[['Comment réserver un animal ?','Créez un compte client, ouvrez la messagerie et indiquez le nom de l’animal qui vous intéresse. L’éleveur vous répondra pour préciser les disponibilités et les étapes.'],['Puis-je visiter l’élevage ?','Contactez l’éleveur afin de convenir des modalités et d’un éventuel rendez-vous.'],['Comment suivre mon futur compagnon ?','Une fois votre compte associé à un animal, vous retrouverez sa fiche, les photos, les informations de santé et les paiements enregistrés dans Mon espace.'],['Comment contacter l’éleveur ?','Depuis la messagerie de votre compte ou par téléphone au 06 48 77 46 37.'],['Comment créer un compte vendeur ?','Les rôles vendeur, éleveur et développeur sont attribués par l’administration. Une inscription publique crée uniquement un compte client.'],['Mes échanges sont-ils privés ?','Les conversations sont accessibles au client concerné, à l’éleveur / administrateur et au développeur du site pour le suivi technique et la modération.']];
 app.innerHTML='<h1>Questions fréquentes</h1><p>Les réponses aux questions les plus courantes sur le fonctionnement du site.</p>'+rows.map(([q,a])=>`<details class="card"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')+`<div class="card"><b>Vous ne trouvez pas votre réponse ?</b><p><a href="#/contact">Contactez l’éleveur</a></p></div>`;
}

// Messagerie commune. Les droits réels sont imposés par les politiques RLS du SQL fourni séparément.
async function closGetConversations(){
 const {data,error}=await sb.from('conversations').select('id,customer_id,assigned_to,subject,status,created_at,updated_at').order('updated_at',{ascending:false});
 if(error)throw error;return data||[];
}
async function closGetMessages(cid){const{data,error}=await sb.from('messages').select('id,conversation_id,sender_id,body,created_at').eq('conversation_id',cid).order('created_at');if(error)throw error;return data||[]}
function closMessageShell(title,conversations,selected){
 return `<h1>${esc(title)}</h1><div class="card"><div class="row" style="align-items:center"><div style="flex:1"><b>${conversations.length} conversation(s)</b><p class="mut">Messages enregistrés dans votre espace sécurisé.</p></div><button type="button" class="s" id="clos-refresh">Actualiser</button></div><div class="row" style="align-items:flex-start"><aside style="flex:1;min-width:230px;max-width:360px" id="clos-thread-list">${conversations.map(c=>`<button type="button" class="s" data-open-conv="${c.id}" style="display:block;width:100%;text-align:left;margin:5px 0;white-space:normal"><b>${esc(c.subject||'Demande de contact')}</b><br><small>${esc(c.status||'Ouverte')} · ${closDate(c.updated_at||c.created_at)}</small></button>`).join('')||'<p class="mut">Aucune conversation pour le moment.</p>'}</aside><section style="flex:2;min-width:260px" id="clos-thread"><p class="mut">Sélectionnez une conversation pour afficher les messages.</p></section></div></div>`;
}
async function closRenderThread(cid,canReply=true){
 closActiveConversation=cid;const thread=$('#clos-thread');if(!thread)return;
 const {data:conv,error:ce}=await sb.from('conversations').select('id,subject,status,customer_id,assigned_to').eq('id',cid).single();if(ce){thread.innerHTML=closNotice('Conversation inaccessible.');return}
 const msgs=await closGetMessages(cid);
 thread.innerHTML=`<h3>${esc(conv.subject||'Discussion')}</h3><p class="mut">Statut : ${esc(conv.status||'ouverte')}</p><div id="clos-message-log" style="max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)">${msgs.map(m=>`<div style="max-width:88%;margin:8px ${m.sender_id===me.id?'0 0 8px auto':'0 auto 8px 0'};padding:10px 12px;border-radius:12px;background:${m.sender_id===me.id?'#e5efe7':'#fff'}"><div>${esc(m.body).replace(/\n/g,'<br>')}</div><small class="mut">${closDate(m.created_at)} ${m.sender_id===me.id?'· Vous':''}</small></div>`).join('')||'<p class="mut">Aucun message.</p>'}</div>${canReply?`<form id="clos-send-message" style="margin-top:12px"><label>Votre message<textarea name="body" rows="3" maxlength="5000" required placeholder="Écrivez votre message…"></textarea></label><button>Envoyer le message</button></form>`:''}`;
 const log=$('#clos-message-log');if(log)log.scrollTop=log.scrollHeight;
 const form=$('#clos-send-message');if(form)form.onsubmit=async e=>{e.preventDefault();const body=new FormData(form).get('body').trim();if(!body)return;const b=form.querySelector('button');b.disabled=true;const{error}=await sb.from('messages').insert({conversation_id:cid,sender_id:me.id,body});if(error){alert('Envoi impossible : '+error.message);b.disabled=false;return}await sb.from('conversations').update({updated_at:new Date().toISOString()}).eq('id',cid);await closRenderThread(cid,canReply)};
}
async function closCreateConversation(subject,body,animalId=null){
 const{data,error}=await sb.from('conversations').insert({customer_id:me.id,subject:subject.trim(),status:'ouverte',animal_id:animalId}).select('id').single();if(error)throw error;
 const{error:meErr}=await sb.from('messages').insert({conversation_id:data.id,sender_id:me.id,body:body.trim()});if(meErr)throw meErr;
 return data.id;
}
async function closClientMessages(){
 try{
  const conv=await closGetConversations();app.innerHTML=`<h1>Ma messagerie</h1><div class="card"><h3>Nouvelle demande à l’éleveur</h3><form id="clos-new-conversation"><label>Objet<input name="subject" required maxlength="140" placeholder="Ex. Renseignements sur un chiot"></label><label>Votre message<textarea name="body" required maxlength="5000" placeholder="Présentez votre demande…"></textarea></label><label>Animal concerné (facultatif)<select name="animal_id"><option value="">Aucun animal sélectionné</option></select></label><button>Envoyer à l’éleveur</button></form></div>`+closMessageShell('Mes discussions',conv);
  const {data:animals}=await sb.from('animals').select('id,name').eq('buyer',me.id);const sel=app.querySelector('[name="animal_id"]');(animals||[]).forEach(a=>sel.insertAdjacentHTML('beforeend',`<option value="${a.id}">${esc(a.name)}</option>`));
  $('#clos-new-conversation').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const id=await closCreateConversation(f.subject,f.body,f.animal_id?Number(f.animal_id):null);alert('Message envoyé à l’éleveur.');await closClientMessages();await closRenderThread(id,true)}catch(x){alert(x.message)}};
  document.querySelectorAll('[data-open-conv]').forEach(b=>b.onclick=()=>closRenderThread(b.dataset.openConv,true));$('#clos-refresh').onclick=closClientMessages;
 }catch(e){app.innerHTML='<h1>Ma messagerie</h1>'+closNotice('La messagerie nécessite la migration SQL fournie et ses règles de sécurité. Détail : '+e.message)}
}
async function closStaffMessages(){
 try{const conv=await closGetConversations();app.innerHTML=closMessageShell(prof.role==='dev'?'Centre de supervision des conversations':'Messagerie de l’élevage',conv);
 document.querySelectorAll('[data-open-conv]').forEach(b=>b.onclick=async()=>{await closRenderThread(b.dataset.openConv,true);const thread=$('#clos-thread');if(thread){const c=conv.find(x=>String(x.id)===String(b.dataset.openConv));if(c&&prof.role==='admin'){const {data:sellers}=await sb.from('profiles').select('id,prenom,nom').eq('role','seller');thread.insertAdjacentHTML('afterbegin',`<label>Attribuer au vendeur<select id="clos-assign"><option value="">Non attribué / éleveur</option>${(sellers||[]).map(s=>`<option value="${s.id}" ${s.id===c.assigned_to?'selected':''}>${esc((s.prenom||'')+' '+(s.nom||''))}</option>`).join('')}</select></label>`);$('#clos-assign').onchange=async e=>{const{error}=await sb.from('conversations').update({assigned_to:e.target.value||null}).eq('id',c.id);if(error)alert(error.message);else alert('Attribution mise à jour')}}}});
 $('#clos-refresh').onclick=closStaffMessages;
 }catch(e){app.innerHTML='<h1>Messagerie</h1>'+closNotice('Impossible de charger les conversations : '+e.message)}
}
async function closSellerMessages(){
 try{const conv=await closGetConversations();app.innerHTML=closMessageShell('Messages attribués à mon compte vendeur',conv);document.querySelectorAll('[data-open-conv]').forEach(b=>b.onclick=()=>closRenderThread(b.dataset.openConv,true));$('#clos-refresh').onclick=closSellerMessages}catch(e){app.innerHTML=closNotice(e.message)}
}

// Tableau de bord vendeur : uniquement les annonces qui lui sont affectées.
async function closSeller(){
 try{
 const[{data:A,error},{data:U}]=await Promise.all([sb.from('animals').select('*').eq('seller_id',me.id).order('id'),sb.from('profiles').select('id,prenom,nom,role').in('role',['client','seller'])]);if(error)throw error;
 app.innerHTML=`<h1>Espace vendeur</h1><p>Gérez vos annonces, suivez les demandes qui vous sont attribuées et répondez aux clients.</p><div class="row"><div class="card" style="flex:1"><b>${A.length}</b><br><span class="mut">Annonce(s) attribuée(s)</span></div><div class="card" style="flex:1"><a href="#/messages">Ouvrir ma messagerie</a></div></div><div class="card"><h2>Ajouter une annonce</h2><form id="clos-seller-new" class="row"><label>Nom<input name="name" required maxlength="60"></label><label>Espèce<input name="sp" required maxlength="60"></label><label>Prix (€)<input name="price" type="number" min="0" step="0.01" required></label><label>Statut<select name="status"><option>À naître</option><option>En croissance</option><option>Disponible</option></select></label><label>Description<textarea name="descr" rows="2"></textarea></label><button>Créer l’annonce</button></form></div><h2>Mes annonces</h2>`+(A.map(a=>`<div class="card"><form class="clos-seller-edit" data-id="${a.id}"><h3>${esc(a.name)} <span class="tag">${esc(a.status)}</span></h3><div class="row"><label>Nom<input name="name" value="${esc(a.name)}" required></label><label>Espèce<input name="sp" value="${esc(a.sp)}"></label><label>Prix (€)<input name="price" type="number" min="0" step="0.01" value="${Number(a.price)||0}"></label><label>Statut<select name="status">${ST.map(s=>`<option ${s===a.status?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>Description<textarea name="descr" rows="2">${esc(a.descr||'')}</textarea></label></div><button>Enregistrer</button></form></div>`).join('')||'<p class="mut">Aucune annonce ne vous est encore attribuée. Demandez à l’éleveur de vous affecter un animal.</p>');
 $('#clos-seller-new').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.price=Number(o.price);o.seller_id=me.id;const{error}=await sb.from('animals').insert(o);if(error)alert(error.message);else closSeller()};
 document.querySelectorAll('.clos-seller-edit').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o.price=Number(o.price);const{error}=await sb.from('animals').update(o).eq('id',f.dataset.id).eq('seller_id',me.id);if(error)alert(error.message);else closSeller()});
 }catch(e){app.innerHTML='<h1>Espace vendeur</h1>'+closNotice('Espace vendeur non prêt : appliquez la migration SQL. '+e.message)}
}

// Étend les espaces client / éleveur / développeur sans supprimer les fonctions historiques.
const closOriginalClient=client;
client=async function(){await closOriginalClient();const box=document.createElement('div');box.className='card';box.innerHTML='<h2>Messagerie avec l’éleveur</h2><p>Posez vos questions, transmettez un document ou demandez des nouvelles de votre réservation.</p><a href="#/messages"><button>Accéder à mes discussions</button></a>';app.append(box)};
const closOriginalAdmin=admin;
admin=async function(){await closOriginalAdmin();const box=document.createElement('div');box.className='card';box.innerHTML='<h2>Messagerie et demandes clients</h2><p>Consultez toutes les demandes, répondez aux clients et attribuez une conversation à un vendeur.</p><a href="#/messages"><button>Ouvrir toutes les conversations</button></a><p><b>Gestion vendeurs :</b> attribuez le rôle vendeur depuis la gestion des comptes, puis affectez-lui les animaux et les conversations.</p>';app.prepend(box)};
const closOriginalDev=dev;
dev=async function(){await closOriginalDev();const box=document.createElement('div');box.className='card';box.innerHTML='<h2>Supervision globale</h2><p>Le développeur dispose d’une vue transversale sur toutes les conversations afin de diagnostiquer les problèmes et suivre le bon fonctionnement du service.</p><a href="#/messages"><button>Voir toutes les conversations</button></a><p class="mut">Les permissions de lecture globale sont également vérifiées par Supabase, pas seulement par cette interface.</p>';app.prepend(box)};

// Remplace les listes de rôles de l'interface développeur pour intégrer les vendeurs.
const closRoleObserver=new MutationObserver(()=>document.querySelectorAll('select[data-u]').forEach(s=>{if(![...s.options].some(o=>o.value==='seller'))s.insertAdjacentHTML('beforeend','<option value="seller">seller</option>')}));
closRoleObserver.observe(document.body,{childList:true,subtree:true});

init();
</script></body></html>
