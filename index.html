<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Clos des Poils</title>
<meta name="description" content="Le Clos des Poils — élevage familial de chiots, chatons et lapereaux. Découvrez nos animaux disponibles, nos valeurs et contactez-nous.">
<style>
:root{
  --bg:#f6f7f2;--card:#fff;--ink:#24352b;--mut:#5a6b60;
  --g:#315b45;--a:#c49a62;--line:#e1e8df;
  --shadow:0 12px 32px rgba(32,55,40,.08);--radius:20px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf3ec 0,#f7f8f4 320px);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:13px clamp(14px,4vw,38px);background:rgba(39,79,55,.98);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.08);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
header b{font-size:1.2rem;letter-spacing:.02em}
header nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:.9rem;font-weight:600}
header a:hover,header a:focus-visible{background:rgba(255,255,255,.14)}
main{width:min(1180px,100%);margin:0 auto;padding:clamp(16px,3vw,36px)}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
h1{font-size:clamp(2rem,4vw,3rem);margin:.2em 0 .45em;letter-spacing:-.045em}
h2{font-size:1.45rem;margin:1.1em 0 .55em}
h3{font-size:1.12rem;margin:1.1em 0 .55em}
p{margin:.55em 0 1em}
.card{background:var(--card);border:1px solid rgba(49,91,69,.10);border-radius:20px;padding:clamp(16px,2.5vw,24px);margin:0 0 16px;box-shadow:var(--shadow)}
input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input,select,textarea{width:100%;min-width:0}
textarea{min-height:130px;resize:vertical}
button{background:var(--g);color:#fff;border:1px solid var(--g);cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
button:hover{background:#254a36;transform:translateY(-1px)}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}
button.s:hover{background:#edf3ee}
button.d{background:#a83c35;border-color:#a83c35}
label{display:block;margin:9px 0;min-width:170px;flex:1}
label input,label select,label textarea{display:block;margin-top:5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#edf2ed;color:var(--g);font-size:.82rem;font-weight:650}
footer{text-align:center;padding:28px 16px;color:var(--mut);font-size:.9rem}
footer a{color:var(--mut);margin:0 8px;text-decoration:none}
footer a:hover{color:var(--g);text-decoration:underline}
.mut{color:var(--mut)}.err{color:#a8322a}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
summary{cursor:pointer;font-weight:650}
details[open]>summary{margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line)}
table{font-size:.94rem;border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
img{max-width:100%}
.clos-hero{padding:clamp(24px,5vw,54px);border-radius:26px;background:linear-gradient(125deg,#244b35,#477452);color:#fff;box-shadow:0 18px 45px rgba(34,70,48,.2);margin-bottom:24px}
.clos-hero h1,.clos-hero h2{color:#fff}.clos-hero p{max-width:720px;color:#edf4ed;font-size:1.08rem}
.clos-kicker{text-transform:uppercase;letter-spacing:.13em;font-size:.76rem;font-weight:800;color:#e4c99f}
.clos-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.clos-actions a{text-decoration:none}
.clos-actions button{padding:12px 18px;border-radius:12px}.clos-actions .s{color:#fff;border-color:rgba(255,255,255,.65);background:transparent}
.clos-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
.clos-section-head h2{margin:0}
.clos-category{margin:28px 0}
.clos-category-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.clos-category-head .clos-count{margin-left:auto;background:#eaf0e9;color:var(--g);border-radius:99px;padding:3px 10px;font-size:.82rem;font-weight:700}
.clos-animal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,285px),1fr));gap:16px}
.clos-animal{overflow:hidden;padding:0;display:flex;flex-direction:column}
.clos-animal-photo{width:100%;height:220px;object-fit:cover;background:#e9eee8}
.clos-animal-body{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
.clos-animal-meta{display:flex;gap:7px;flex-wrap:wrap}
.clos-animal-meta span{background:#f0f4ef;border-radius:8px;padding:4px 8px;font-size:.82rem;color:#455b4b}
.clos-price{font-size:1.2rem;font-weight:800;color:var(--g);margin-top:auto}
.clos-filter{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:14px 0 22px}
.clos-page-intro{max-width:760px;color:var(--mut);font-size:1.04rem}
.clos-empty{padding:24px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}
.clos-contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.clos-contact-card{background:#f8faf7;border-radius:16px;padding:18px}
.clos-faq details{margin:10px 0}.clos-faq summary{padding:4px 0}.clos-faq details p{padding-top:10px;color:var(--mut)}
.clos-message-layout{display:grid;grid-template-columns:minmax(230px,330px) 1fr;gap:14px}
.clos-message-layout aside{max-height:620px;overflow:auto}
.clos-message-layout [data-open-conv]{border-radius:12px;background:#f8faf7;border:1px solid var(--line);padding:8px 10px;color:var(--g);font-weight:600;text-align:left;width:100%;margin:5px 0;cursor:pointer;white-space:normal}
.clos-message-layout [data-open-conv]:hover{background:#eaf1e9}
@media(max-width:680px){header{position:static}header nav{width:100%}.clos-filter,.clos-message-layout{grid-template-columns:1fr}.clos-animal-photo{height:200px}.row>*{flex:1 1 100%}}
@page{size:A4;margin:16mm}
@media print{
  body{background:#fff!important;color:#202820!important;font-size:10.5pt}
  header,footer,nav,button,form,.no-print,.sf,.ef,.cf,.pf,.uf,.del-photo,#df,#nu,.admin-only{display:none!important}
  main{width:100%;max-width:none;padding:0;margin:0}
  .card{border:0;box-shadow:none;border-radius:0;padding:0;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}
  details{display:block}
  details>summary{display:none}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;break-inside:avoid}
  h1,h2,h3,h4{break-after:avoid}
}
</style>
</head><body>
<header><b id="brand">Le Clos des Poils</b><nav id="nav"></nav></header>
<main id="app"><p class="mut">Chargement…</p></main>
<footer>
  <a href="#/mentions">Mentions légales</a>
  <a href="#/confidentialite">Confidentialité</a>
  <a href="#/reglement">Règlement</a>
  <a href="#/cgv">Conditions de vente</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* === CONFIGURATION === */
const SB_URL='https://xohucwmckmcjqznmfbrs.supabase.co';
const SB_KEY='sb_publishable_7xiq-m63V_LGIgVbIhQ5ug_7OEClRCa';
let ELEV='Clos des Poils', ACOMPTE=300;
let PAYINFO='Paiement par virement, Wero ou chèque. Pour obtenir les coordonnées de paiement (IBAN, ordre du chèque, adresse d’envoi), contactez l’éleveur par téléphone au 06 48 77 46 37 (Jordan Pougnet) : il vous les communiquera.';

/* Valeurs légales par défaut (modifiables via /dev) */
const LEGAL_DEFAULTS = {
  nom:'Jordan Pougnet — Le Clos des Poils',
  forme:'Entreprise individuelle',
  siren:'[à compléter via Administration]',
  siret:'[à compléter via Administration]',
  adresse:'[adresse de l’élevage à compléter]',
  email:'[email de contact à compléter]',
  tel:'06 48 77 46 37',
  directeur:'Jordan Pougnet',
  hebergeur:'GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA)',
  region_bdd:'UE — région Supabase',
  mediateur:'[médiateur de la consommation à compléter]',
  sort_acompte:'L’acompte est restitué en cas d’annulation par l’éleveur, ou conservé en cas de désistement de l’acquéreur après signature, sauf accord contraire.',
  age_remise:'8 semaines (conformément à la réglementation)',
  mentions_elevage:'Élevage familial déclaré. Animaux identifiés (puce électronique) et enregistrés auprès de l’I-CAD.',
  duree_compte:'3 ans après le dernier contact',
  duree_contrats:'10 ans (obligation comptable et légale)',
  service_email:'Supabase Auth (emails transactionnels)',
  transferts:'Aucun transfert hors UE en dehors des prestataires listés',
  tva:'Prix TTC. TVA non applicable, art. 293 B du CGI.',
  points_cgv:'Délai de rétractation de 14 jours, garanties légales de conformité et des vices cachés, documents remis (carnet de santé, certificat vétérinaire, attestation de cession), modalités de remboursement de l’acompte, recours à un médiateur de la consommation.'
};

/* === INITIALISATION === */
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const dt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '';
const dtFull = d => d ? new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '';

let ST = ['À naître','En croissance','Disponible','Réservée','Adopté','Vendue','Père','Mère','Non disponible'];
let CC = {vaccins:'Vaccins',vermifuge:'Vermifuge',antipar:'Antiparasitaires (puces, tiques)',autres:'Autres soins'};
let CT = [
  ['reservation','Contrat de réservation','Entre {eleveur} (l’éleveur) et {acquereur} (l’acquéreur).\n\nL’éleveur réserve à l’acquéreur {animal} ({desc}), né(e) le {naissance}, au prix de {prix}. Un acompte de {acompte} confirme la réservation.'],
  ['sante','Engagement santé de l’animal','L’acquéreur s’engage à faire suivre {animal} par un vétérinaire, à respecter le calendrier de vaccins et de vermifuges, et à prévenir l’éleveur en cas de problème de santé.'],
  ['achat','Conditions d’achat','Le solde est dû avant la remise de {animal}, prévue le {remise}. L’animal est remis identifié et accompagné de ses documents de santé.']
];

const DOCS = {
  reglement:{t:'Règlement du site',x:`# 1. Objet
Ce site permet aux acquéreurs de suivre l’animal réservé auprès de {{nom}}. Il ne remplace pas le contrat de vente.

# 2. Compte
Le compte est réservé aux personnes majeures. Les informations fournies doivent être exactes. Les identifiants sont personnels et ne doivent pas être partagés.

# 3. Fiches et suivi de l’animal
Les fiches, soins, vaccins, vermifuges et paiements sont renseignés et modifiés uniquement par l’éleveur. L’acquéreur les consulte en lecture seule et peut signaler une erreur à {{email}}.

# 4. Réservation et acompte
La réservation est enregistrée par l’éleveur. Un acompte de ${ACOMPTE} € est à régler dans les 7 jours. La réservation devient définitive à la signature des contrats en ligne et à réception de l’acompte. Sort de l’acompte en cas d’annulation : {{sort_acompte}}.

# 5. Remise de l’animal
L’animal est remis à l’âge minimum légal {{age_remise}}, identifié et accompagné des documents prévus par la loi.

# 6. Signature électronique
La saisie du nom complet et la case « lu et approuvé » valent signature électronique ; la date et l’heure sont conservées.

# 7. Contenus
Textes et photos appartiennent à l’éleveur et ne peuvent être diffusés sans son accord.

# 8. Responsabilité
Le site est fourni en l’état ; des interruptions sont possibles pour maintenance.

# 9. Données personnelles
Voir la politique de confidentialité.

# 10. Droit applicable et litiges
Droit français. En cas de litige, l’acquéreur consommateur peut recourir gratuitement à un médiateur de la consommation : {{mediateur}}.`},

  mentions:{t:'Mentions légales',x:`# Éditeur
{{nom}}, {{forme}}, SIREN {{siren}}, {{adresse}}, {{email}}, {{tel}}. Directeur de la publication : {{directeur}}.

# Hébergement
Site : {{hebergeur}}. Base de données : Supabase, région {{region_bdd}}.

# Activité d’élevage
{{mentions_elevage}}

# Propriété intellectuelle
Les contenus du site sont protégés. Toute reproduction sans accord est interdite.`},

  confidentialite:{t:'Politique de confidentialité',x:`# Responsable du traitement
{{nom}}, {{adresse}}, {{email}}.

# Données collectées
Identité (prénom, nom), e-mail, téléphone, données de réservation et de suivi de l’animal, paiements enregistrés, signatures électroniques horodatées, date d’acceptation du règlement.

# Finalités et bases légales
Gérer votre compte et la réservation (exécution du contrat) ; respecter les obligations comptables et légales ; assurer la sécurité du site (intérêt légitime).

# Durées de conservation
Compte : durée de la relation puis {{duree_compte}}. Contrats et paiements : {{duree_contrats}}. Après suppression du compte, les contrats signés peuvent être conservés pour ces durées.

# Destinataires
L’éleveur, et nos prestataires techniques : {{hebergeur}}, Supabase, {{service_email}}. Transferts hors UE : {{transferts}}.

# Vos droits
Accès, rectification, effacement, limitation, opposition, portabilité. Depuis « Mon espace » vous pouvez télécharger vos données et supprimer votre compte. Sinon écrivez à {{email}}. Vous pouvez saisir la CNIL (cnil.fr).

# Cookies
Le site utilise uniquement un stockage technique nécessaire à votre connexion. Aucun traceur publicitaire ni de mesure d’audience : aucun bandeau de consentement n’est requis. Si vous ajoutez un outil de statistiques, ce texte et un bandeau devront être mis à jour.

# Sécurité
Connexion chiffrée (HTTPS), accès aux données restreint par compte.`},

  cgv:{t:'Conditions de vente',x:`# Brouillon à faire valider par un professionnel
Prix : {{tva}}. Les animaux sont vendus selon le contrat de réservation et les conditions d’achat signés en ligne.

# Points à compléter avant publication
{{points_cgv}}`}
};

let me = null, prof = null, OPEN = null, CFG = {}, closRealtime = null;

const LK = [
  ['nom','Nom / raison sociale'],['forme','Forme juridique'],['siren','SIREN'],['siret','SIRET'],
  ['adresse','Adresse'],['email','E-mail de contact'],['tel','Téléphone'],
  ['directeur','Directeur de la publication'],['hebergeur','Hébergeur du site'],
  ['region_bdd','Région de la base'],['mediateur','Médiateur de la consommation'],
  ['sort_acompte','Sort de l’acompte'],['age_remise','Âge minimum de remise'],
  ['mentions_elevage','Mentions élevage'],['duree_compte','Durée conservation compte'],
  ['duree_contrats','Durée conservation contrats'],['service_email','Service email'],
  ['transferts','Transferts hors UE'],['tva','TVA'],['points_cgv','Points CGV']
];
const LKM = Object.fromEntries(LK);

const L = x => x.replace(/\{\{(\w+)\}\}/g, (m,k) => {
  const val = CFG.legal?.[k] || LEGAL_DEFAULTS[k];
  return val || `[${LKM[k]||k} à compléter]`;
});
const dd = d => d ? dt(d) : '[à définir]';

async function fn(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    let m = error.message;
    try { m = (await error.context.json()).error || m; } catch {}
    throw new Error(m);
  }
  return data;
}

const isA = () => prof?.role === 'admin' || prof?.role === 'dev';
const isD = () => prof?.role === 'dev';
const DEF = {
  name:'Le Clos des Poils',
  hero:'Élevage familial de chiots, chatons et lapereaux. Retrouvez ici le suivi de votre futur compagnon.',
  colors:{}, css:'', sections:[]
};
const secs = w => (CFG.sections || []).filter(s => s.where === w);
const secHtml = s => `<div class="card"><h2>${esc(s.title)}</h2>${s.html}</div>`;

/* === CHARGEMENT CONFIG === */
async function loadCfg() {
  try {
    const { data } = await sb.from('settings').select('value').eq('key','site_config').maybeSingle();
    try { CFG = { ...DEF, ...JSON.parse(data?.value || '{}') }; }
    catch { CFG = { ...DEF }; }
  } catch { CFG = { ...DEF }; }
  if (CFG.elev) ELEV = CFG.elev;
  if (CFG.acompte != null) ACOMPTE = +CFG.acompte;
  if (CFG.payinfo) PAYINFO = CFG.payinfo;
  if (CFG.contracts) CT = CFG.contracts;
  if (CFG.careCats) CC = CFG.careCats;
  if (CFG.statuses) ST = CFG.statuses;
  const r = document.documentElement.style;
  ['g','a','bg'].forEach(k => r.removeProperty('--'+k));
  for (const [k,v] of Object.entries(CFG.colors || {})) if (v) r.setProperty('--'+k, v);
  let st = $('#cs');
  if (!st) { st = document.createElement('style'); st.id = 'cs'; document.head.append(st); }
  st.textContent = CFG.css || '';
  const brand = $('#brand');
  if (brand) brand.textContent = CFG.name || DEF.name;
  document.title = CFG.name || DEF.name;
}

const fmt = x => x.split('\n\n').map(p => {
  if (p.startsWith('# ')) {
    const lines = p.slice(2).split('\n');
    return `<h3>${esc(lines[0])}</h3>${esc(lines.slice(1).join('\n')).replace(/\n/g,'<br>')}`;
  }
  return `<p>${esc(p).replace(/\n/g,'<br>')}</p>`;
}).join('');

/* === INIT === */
async function init() {
  let bad = 0;
  try {
    await loadCfg();
    const { data:{ session } } = await sb.auth.getSession();
    me = session?.user || null;
    prof = null;
    if (me) {
      const { data } = await sb.from('profiles').select('*').eq('id', me.id).single();
      prof = data;
    }
  } catch (e) {
    bad = 1;
    if (!CFG.name) CFG = { ...DEF };
    app.innerHTML = '<div class="card err"><b>Erreur de chargement.</b><br>' + esc(e.message || e) + '<br><br>Vérifiez votre connexion internet puis rechargez la page.</div>';
  }
  nav();
  if (!bad) route();
  applyDeveloperLabels();
}

sb.auth.onAuthStateChange((ev, sess) => {
  const id = sess?.user?.id || null;
  if (id !== (me?.id || null)) setTimeout(init, 0);
});

/* === PERSONNALISATION DES LIBELLÉS === */
function applyDeveloperLabels(root = document) {
  const labels = CFG.uiLabels || {};
  if (!Object.keys(labels).length) return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(node => {
    const original = node.nodeValue.trim();
    if (Object.prototype.hasOwnProperty.call(labels, original)) {
      const leading = node.nodeValue.match(/^\s*/)?.[0] || '';
      const trailing = node.nodeValue.match(/\s*$/)?.[0] || '';
      node.nodeValue = leading + labels[original] + trailing;
    }
  });
}

/* === NAVIGATION === */
const CLOS_ROLE_LABELS = {client:'Client', admin:'Éleveur', seller:'Vendeur', dev:'Développeur'};
const closIsStaff = () => ['admin','dev'].includes(prof?.role);
const closNotice = msg => `<div class="card" role="status">${esc(msg)}</div>`;

function nav() {
  let links = '<a href="#/">Accueil</a><a href="#/faq">FAQ</a><a href="#/contact">Contact</a>';
  links += secs('page').map(s => `<a href="#/p-${esc(s.id)}">${esc(s.title)}</a>`).join('');
  if (me) {
    const role = prof?.role || 'client';
    const label = role === 'dev' ? 'Admin' : role === 'admin' ? 'Espace éleveur' : role === 'seller' ? 'Espace vendeur' : 'Mon espace';
    links += `<a href="#/compte">${label}</a><a href="#/messages">Messagerie</a>`;
    if (role === 'dev') links += '<a href="#/dev">Admin site</a><a href="#/admin-textes">Documents</a>';
    links += '<a href="#" id="out">Déconnexion</a>';
  } else {
    links += '<a href="#/compte">Connexion / Inscription</a>';
  }
  const navEl = $('#nav');
  if (navEl) navEl.innerHTML = links;
  const o = $('#out');
  if (o) o.onclick = async e => {
    e.preventDefault();
    try { if (closRealtime) { sb.removeChannel(closRealtime); closRealtime = null; } } catch {}
    await sb.auth.signOut();
  };
}

/* === ROUTEUR UNIFIÉ === */
function route() {
  const h = location.hash.slice(2) || '';
  // Documents légaux
  if (DOCS[h]) return doc(h);
  // Pages publiques
  if (h === 'faq') return closFaq();
  if (h === 'contact') return closContact();
  // Messagerie
  if (h === 'messages') {
    if (!me) { location.hash = '#/compte'; return; }
    if (!['client','seller','admin','dev'].includes(prof?.role)) {
      app.innerHTML = '<h1>Messagerie</h1><div class="card err">Votre compte n’a pas accès à la messagerie.</div>';
      return;
    }
    return closMessagesByRole();
  }
  // Espaces
  if (h === 'compte') {
    if (!me) return login();
    if (prof?.role === 'dev' || prof?.role === 'admin') return admin();
    if (prof?.role === 'seller') return closSeller();
    return client();
  }
  if (h === 'vendeur') {
    if (me && prof?.role === 'seller') return closSeller();
    location.hash = '#/compte'; return;
  }
  if (h === 'admin-textes' && isA()) return textes();
  if (h === 'dev' && isD()) return dev();
  // Pages dynamiques
  if (h.startsWith('p-')) {
    const x = secs('page').find(y => 'p-'+y.id === h);

/* === PAGE ACCUEIL === */
function catOf(v) {
  const x = String(v||'').toLowerCase();
  if (/bovin|vache|taureau|veau/.test(x)) return ['Bovins','🐄'];
  if (/caprin|chèvre|chevre|bouc|chevreau/.test(x)) return ['Caprins','🐐'];
  if (/ovin|mouton|brebis|agneau/.test(x)) return ['Ovins','🐑'];
  if (/équin|equin|cheval|poney|âne|ane/.test(x)) return ['Équins','🐴'];
  if (/porcin|cochon|porc|truie/.test(x)) return ['Porcins','🐖'];
  if (/volaille|poule|coq|canard|oie|dinde|pintade/.test(x)) return ['Volailles','🐓'];
  if (/chien|chiot|canin/.test(x)) return ['Chiens','🐕'];
  if (/chat|chaton|félin|felin/.test(x)) return ['Chats','🐈'];
  if (/lapin|lapereau|cunicul/.test(x)) return ['Lapins','🐇'];
  return ['Autres animaux','🐾'];
}

function login(sign = false) {
  document.title = (sign ? 'Créer mon compte' : 'Connexion') + ' — ' + (CFG.name || DEF.name);
  app.innerHTML = `
    <div class="card" style="max-width:520px;margin:0 auto">
      <h2>${sign ? 'Créer mon compte' : 'Connexion'}</h2>
      <form id="f">
        ${sign
          ? '<label>Prénom<input name="prenom" required maxlength="60"></label><label>Nom<input name="nom" required maxlength="60"></label><label>Téléphone<input name="tel" type="tel" maxlength="20"></label>'
          : ''}
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Mot de passe${sign?' (10 caractères minimum)':''}<input name="pw" type="password" minlength="${sign?10:1}" required autocomplete="${sign?'new-password':'current-password'}"></label>
        ${sign
          ? '<label><input type="checkbox" name="ok" required style="width:auto;margin-right:6px"> Je suis majeur(e) et j’accepte le <a href="#/reglement" target="_blank">règlement</a> et la <a href="#/confidentialite" target="_blank">politique de confidentialité</a>.</label>'
          : ''}
        <p id="m" class="err"></p>
        <button>${sign ? 'Créer mon compte' : 'Se connecter'}</button>
        <button type="button" class="s" id="sw">${sign ? 'J’ai déjà un compte' : 'Créer un compte'}</button>
      </form>
      ${!sign ? `<hr><p class="mut">Les comptes vendeur, éleveur et développeur sont créés par l’administration. Une inscription publique crée uniquement un compte client.</p>` : ''}
    </div>`;
  $('#sw').onclick = () => login(!sign);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const r = sign
      ? await sb.auth.signUp({
          email: f.email, password: f.pw,
          options: { data: { prenom:f.prenom, nom:f.nom, tel:f.tel, consent:new Date().toISOString() } }
        })
      : await sb.auth.signInWithPassword({ email: f.email, password: f.pw });
    if (r.error) $('#m').textContent = r.error.message;
    else if (sign && !r.data.session)
      app.innerHTML = '<div class="card">Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse, puis connectez-vous.</div>';
  };
}

async function client() {
  document.title = 'Mon espace — ' + (CFG.name || DEF.name);
  try {
    const { data:A } = await sb.from('animals').select('*').eq('buyer', me.id);
    const ids = (A||[]).map(a => a.id);
    let P = [], S = [];
    if (ids.length) {
      const [pRes, sRes] = await Promise.all([
        sb.from('payments').select('*').in('animal_id', ids).order('d'),
        sb.from('signatures').select('*').in('animal_id', ids)
      ]);
      P = pRes.data || []; S = sRes.data || [];
    }
    app.innerHTML = `<h1>Bonjour ${esc(prof?.prenom || '')}</h1>`
      + (A?.length
          ? A.map(a => fiche(a, P, S)).join('')
          : '<p class="mut">Aucun animal n’est encore rattaché à votre compte. L’éleveur le fera après votre réservation.</p>')
      + secs('client').map(secHtml).join('')
      + `<div class="card"><h3>Messagerie avec l’éleveur</h3>
          <p>Posez vos questions, transmettez un document ou demandez des nouvelles de votre réservation.</p>
          <a href="#/messages"><button type="button">Accéder à mes discussions</button></a></div>`
      + `<div class="card"><h3>Mes données</h3>
          <button class="s" id="ex" type="button">Télécharger mes données</button>
          <button class="d" id="del" type="button">Supprimer mon compte</button></div>`;

    document.querySelectorAll('[data-print-animal]').forEach(b => b.onclick = () => {
      const animal = A.find(x => x.id == b.dataset.printAnimal);
      if (animal) printAnimalSheet(animal, P, S);
    });
    document.querySelectorAll('.sf').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.from('signatures').insert({
        animal_id: +f.dataset.a, user_id: me.id,
        contract_key: f.dataset.k,
        name: f.querySelector('input:not([type=checkbox])').value
      });
      if (error) alert(error.message);
      else { alert('Contrat signé ✔'); client(); }
    });
    const exBtn = $('#ex');
    if (exBtn) exBtn.onclick = () => {
      const blob = new Blob([JSON.stringify({profil:prof, animaux:A, paiements:P, signatures:S}, null, 1)], {type:'application/json'});
      const u = document.createElement('a');
      u.href = URL.createObjectURL(blob); u.download = 'mes-donnees.json'; u.click();
    };
    const delBtn = $('#del');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm('Supprimer définitivement votre compte ? Les contrats signés peuvent être conservés selon nos obligations légales.')) return;
      const { error } = await sb.rpc('delete_my_account');
      if (error) { alert(error.message); return; }
      await sb.auth.signOut();
      location.hash = '#/';
    };
  } catch (e) {
    app.innerHTML = '<div class="card err">Erreur : ' + esc(e.message) + '</div>';
  }
}

/* === ADMIN (éleveur) === */
async function admin() {
  document.title = 'Espace éleveur — ' + (CFG.name || DEF.name);
  try {
    const [aRes, uRes, pRes, sRes] = await Promise.all([
      sb.from('animals').select('*').order('id'),
      sb.from('profiles').select('id,prenom,nom,role').in('role', ['client','seller']),
      sb.from('payments').select('*').order('d'),
      sb.from('signatures').select('*')
    ]);
    const A = aRes.data || [], U = uRes.data || [], P = pRes.data || [], S = sRes.data || [];
    const ML = {name:60, sp:40, descr:500, sex:20};
    const inp = (a, k, l) => `<label>${l}<input name="${k}" maxlength="${ML[k]}" value="${esc(a[k]||'')}"></label>`;

    app.innerHTML = `<h1>Espace éleveur</h1>
      <div class="card">
        <h2>Messagerie et demandes clients</h2>
        <p>Consultez toutes les demandes, répondez aux clients et attribuez une conversation à un vendeur.</p>
        <a href="#/messages"><button type="button">Ouvrir toutes les conversations</button></a>
      </div>
      <button id="new" type="button">Ajouter un animal</button><br><br>`
      + A.map(a => adminAnimalCard(a, A, U, P, S)).join('');

    $('#new').onclick = async () => {
      const { error } = await sb.from('animals').insert({ name:'Nouvel animal', status:'À naître' });
      if (error) alert(error.message); else admin();
    };

    // Formulaires fiche animal
    document.querySelectorAll('.ef').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const o = Object.fromEntries(new FormData(f));
      const a = A.find(x => x.id == f.closest('[data-id]').dataset.id);
      const d = a.data || {};
      const profile = d.profile || {};
      Object.keys(o).filter(k => k.startsWith('p_')).forEach(k => {
        profile[k.slice(2)] = o[k]; delete o[k];
      });
      d.profile = profile;
      o.data = d;
      o.buyer = o.buyer || null;
      o.price = +o.price;
      o.born = o.born || null;
      o.remise = o.remise || null;
      o.sex = o.sex || null;
      const { error } = await sb.from('animals').update(o).eq('id', a.id);
      if (error) alert(error.message); else { OPEN = a.id; admin(); }
    });

    document.querySelectorAll('.ident-select').forEach(sel => sel.onchange = () => {
      const form = sel.closest('form');
      form.querySelectorAll('.ident-detail').forEach(el => {
        el.style.display = sel.value === 'Oui' ? 'block' : 'none';
        if (sel.value !== 'Oui') el.querySelectorAll('input,select').forEach(i => i.value = '');
      });
    });

    // Soins
    document.querySelectorAll('.cf').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const o = Object.fromEntries(new FormData(f));
      const a = A.find(x => x.id == f.closest('[data-id]').dataset.id);
      const d = a.data || {};
      d.care = d.care || {};
      (d.care[o.k] = d.care[o.k] || []).push({ n:o.n, d:o.d, rd:o.rd });
      const { error } = await sb.from('animals').update({ data:d }).eq('id', a.id);
      if (error) alert(error.message); else { OPEN = a.id; admin(); }
    });

    // Paiements
    document.querySelectorAll('.pf').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const o = Object.fromEntries(new FormData(f));
      o.a = +o.a;
      o.animal_id = f.closest('[data-id]').dataset.id;
      const { error } = await sb.from('payments').insert(o);
      if (error) alert(error.message); else { OPEN = +o.animal_id; admin(); }
    });

    document.querySelectorAll('.pay-save').forEach(b => b.onclick = async () => {
      const row = b.closest('.pay-item');
      const paymentId = row.dataset.payid;
      const amount = Number(row.querySelector('[data-pay="a"]').value);
      const o = {
        l: row.querySelector('[data-pay="l"]').value.trim(),
        a: amount,
        d: row.querySelector('[data-pay="d"]').value
      };
      if (!o.l || !o.d || !Number.isFinite(amount) || amount < 0) return alert('Vérifiez les champs.');
      if (!confirm('Confirmer la modification ?')) return;
      const { error } = await sb.from('payments').update(o).eq('id', paymentId);
      if (error) alert(error.message); else { OPEN = Number(row.dataset.animal); admin(); }
    });

    document.querySelectorAll('.pay-delete').forEach(b => b.onclick = async () => {
      const row = b.closest('.pay-item');
      if (!confirm('Supprimer définitivement ce paiement ?')) return;
      const { error } = await sb.from('payments').delete().eq('id', row.dataset.payid);
      if (error) alert(error.message); else { OPEN = Number(row.dataset.animal); admin(); }
    });

    // Soins : supprimer / modifier
    document.querySelectorAll('.c-del').forEach(b => b.onclick = async () => {
      if (!confirm('Supprimer ce soin ?')) return;
      const el = b.closest('.care-item');
      const a = A.find(x => x.id == el.dataset.animal);
      const d = a.data || {};
      if (d.care && d.care[el.dataset.k]) {
        d.care[el.dataset.k].splice(el.dataset.i, 1);
        const { error } = await sb.from('animals').update({ data:d }).eq('id', a.id);
        if (error) alert(error.message); else { OPEN = a.id; admin(); }
      }
    });
    document.querySelectorAll('.c-edit').forEach(b => b.onclick = async () => {
      const el = b.closest('.care-item');
      const a = A.find(x => x.id == el.dataset.animal);
      const d = a.data || {};
      const k = el.dataset.k, i = el.dataset.i;
      const old = d.care[k][i];
      const n = prompt('Nom du soin :', old.n); if (n === null) return;
      const date = prompt('Date (AAAA-MM-JJ) :', old.d); if (date === null) return;
      const rd = prompt('Rappel (AAAA-MM-JJ, vide si aucun) :', old.rd || ''); if (rd === null) return;
      d.care[k][i] = { n, d:date, rd:rd || null };
      const { error } = await sb.from('animals').update({ data:d }).eq('id', a.id);
      if (error) alert(error.message); else { OPEN = a.id; admin(); }
    });

    // Upload photo
    document.querySelectorAll('.uf').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const fileInput = f.querySelector('input[type="file"]');
      const comment = f.querySelector('input[name="comment"]').value;
      const file = fileInput.files[0];
      if (!file) return;
      const btn = f.querySelector('button');
      btn.textContent = 'Envoi...';
      const animalId = +f.dataset.id;
      const animal = A.find(x => x.id == animalId);
      const fileName = `${animalId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
      const { error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
      if (uploadError) { alert(uploadError.message); btn.textContent = 'Mettre en ligne'; return; }
      const { data:{ publicUrl } } = sb.storage.from('photos').getPublicUrl(fileName);
      const newPhoto = { url:publicUrl, comment, date:new Date().toISOString() };
      const newPhotos = animal.photos ? [...animal.photos, newPhoto] : [newPhoto];
      const { error: updateError } = await sb.from('animals').update({ photos:newPhotos }).eq('id', animalId);
      if (updateError) alert(updateError.message);
      else { OPEN = animalId; admin(); }
    });

    document.querySelectorAll('.del-photo').forEach(b => b.onclick = async () => {
      if (!confirm('Supprimer cette photo ?')) return;
      const animal = A.find(x => x.id == b.dataset.animal);
      const newPhotos = [...animal.photos];
      newPhotos.splice(+b.dataset.i, 1);
      const { error } = await sb.from('animals').update({ photos:newPhotos }).eq('id', animal.id);
      if (error) alert(error.message); else { OPEN = animal.id; admin(); }
    });

  } catch (e) {
    app.innerHTML = '<div class="card err">Erreur espace éleveur : ' + esc(e.message) + '</div>';
  }
}

/* === TEXTES LÉGAUX (admin) === */
async function textes() {
  try {
    const { data } = await sb.from('settings').select('*');
    const m = Object.fromEntries((data||[]).map(r => [r.key, r]));
    app.innerHTML = '<h1>Textes légaux</h1>'
      + '<p class="mut">Relisez chaque texte, complétez les variables, puis validez.</p>'
      + Object.entries(DOCS).map(([k,d]) => `
        <form class="card" data-k="${k}">
          <h3>${d.t} ${m[k]?.validated ? `<span class="tag">Validé le ${dt(m[k].validated_at)}</span>` : '<span class="tag">À valider</span>'}</h3>
          <textarea name="x" style="min-height:300px">${esc(m[k]?.value||d.x)}</textarea><br>
          <button>Valider et publier</button>
        </form>`).join('');
    document.querySelectorAll('form[data-k]').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.from('settings').upsert({
        key: f.dataset.k, value: f.x.value,
        validated: true, validated_at: new Date().toISOString(), validated_by: me.id
      });
      if (error) alert(error.message); else textes();
    });
  } catch (e) {
    app.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

      <div class="row">${[['g','Couleur principale'],['a','Accent'],['bg','Fond']].map(([k,l]) => `<label>${l}<input type="color" name="c_${k}" value="${col[k]||D[k]}"></label>`).join('')}</div>
      <label>CSS personnalisé<textarea name="css">${esc(c.css||'')}</textarea></label>
      <h3>Sections</h3><div id="secs"></div><button type="button" class="s" id="addsec">Ajouter une section</button>
      <h3>Personnalisation des libellés</h3>
      <label>Libellés (JSON)<textarea name="ui_labels" rows="6">${esc(JSON.stringify(c.uiLabels||{},null,2))}</textarea></label>
      <h3>Modèles PDF</h3>
      <label>Titre PDF<input name="pdf_title" value="${esc(c.pdf?.title||c.name||'Le Clos des Poils')}"></label>
      <label>Sous-titre PDF<input name="pdf_subtitle" value="${esc(c.pdf?.subtitle||'Fiche individuelle')}"></label>
      <label>Pied de page PDF<textarea name="pdf_footer" rows="2">${esc(c.pdf?.footer||'Document de suivi édité par l’éleveur.')}</textarea></label>
      <h3>Informations légales</h3>
      ${LK.map(([k,l]) => `<label>${l}<input name="l_${k}" value="${esc(c.legal?.[k]||LEGAL_DEFAULTS[k]||'')}"></label>`).join('')}
      <h3>Avancé (JSON)</h3>
      <textarea name="adv" style="min-height:180px">${esc(adv)}</textarea><br>
      <button>Enregistrer le site</button>
    </form>
    <div class="card"><h3>Comptes</h3><div id="accts"></div></div>
    <form id="nu" class="card">
      <h3>Créer un compte</h3>
      <div class="row">
        <label>Prénom<input name="prenom" required maxlength="60"></label>
        <label>Nom<input name="nom" required maxlength="60"></label>
        <label>E-mail<input name="email" type="email" required></label>
        <label>Mot de passe<input name="password" type="password" minlength="10" required></label>
        <label>Rôle<select name="role"><option>client</option><option>seller</option><option>admin</option><option>dev</option></select></label>
        <button>Créer</button>
      </div>
    </form>
    <div class="card">
      <h3>Base de données</h3>
      <div class="row">
        <select id="tb">${['animals','payments','signatures','profiles','settings'].map(t => `<option>${t}</option>`).join('')}</select>
        <button class="s" id="ld" type="button">Charger</button>
        <button id="sv" type="button">Enregistrer</button>
      </div>
      <textarea id="rows" style="min-height:200px"></textarea>
      <div class="row"><input id="delid" placeholder="id à supprimer"><button class="d" id="dl" type="button">Supprimer</button></div>
    </div>`;

  // Sections dynamiques
  const S = (c.sections || []).map(x => ({...x}));
  const rs = () => {
    $('#secs').innerHTML = S.map((s,i) => `
      <div class="card" data-i="${i}">
        <div class="row">
          <label>ID<input data-f="id" value="${esc(s.id||'')}"></label>
          <label>Titre<input data-f="title" value="${esc(s.title||'')}"></label>
          <label>Emplacement<select data-f="where">${['home','client','page'].map(w => `<option ${w==s.where?'selected':''}>${w}</option>`).join('')}</select></label>
          <button type="button" class="d" data-rm="${i}">Retirer</button>
        </div>
        <textarea data-f="html">${esc(s.html||'')}</textarea>
      </div>`).join('');
    document.querySelectorAll('#secs [data-f]').forEach(el => el.oninput = () => {
      S[+el.closest('[data-i]').dataset.i][el.dataset.f] = el.value;
    });
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      S.splice(+b.dataset.rm, 1); rs();
    });
  };
  rs();
  $('#addsec').onclick = () => {
    S.push({id:'section'+(S.length+1), title:'Nouvelle section', where:'home', html:'<p>Contenu…</p>'});
    rs();
  };

  $('#df').onsubmit = async e => {
    e.preventDefault();
    const f = e.target.elements;
    let a;
    try { a = JSON.parse(f.adv.value); } catch { return alert('JSON avancé invalide'); }
    const colors = {};
    for (const k of ['g','a','bg']) if (f['c_'+k].value !== D[k]) colors[k] = f['c_'+k].value;
    let uiLabels;
    try { uiLabels = JSON.parse(f.ui_labels.value || '{}'); } catch { return alert('JSON libellés invalide'); }
    const { error } = await sb.from('settings').upsert({
      key:'site_config',
      value: JSON.stringify({
        ...a,
        name: f['name'].value, hero: f.hero.value, css: f.css.value, colors, sections:S, uiLabels,
        pdf: {title:f.pdf_title.value, subtitle:f.pdf_subtitle.value, footer:f.pdf_footer.value},
        legal: Object.fromEntries(LK.map(([k]) => [k, f['l_'+k].value || LEGAL_DEFAULTS[k]]))
      }),
      validated:true, validated_at:new Date().toISOString(), validated_by:me.id
    });
    if (error) alert(error.message);
    else { await loadCfg(); nav(); alert('Site enregistré'); }
  };

  // Comptes
  const accts = async () => {
    const [uRes, aRes] = await Promise.all([
      sb.from('profiles').select('*').order('created_at'),
      sb.from('animals').select('id,buyer')
    ]);
    const U = uRes.data || [], A = aRes.data || [];
    $('#accts').innerHTML = '<div style="overflow-x:auto"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Créé le</th><th>Animaux</th><th></th></tr>'
      + U.map(u => `<tr>
          <td>${esc((u.prenom||'')+' '+(u.nom||''))}</td>
          <td>${esc(u.email||'')}</td>
          <td><select data-u="${u.id}">${['client','seller','admin','dev'].map(r => `<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td>
          <td>${dt(u.created_at)}</td>
          <td align="center">${A.filter(a => a.buyer==u.id).length}</td>
          <td><button class="d" data-x="${u.id}" data-e="${esc(u.email||'')}">Supprimer</button></td>
        </tr>`).join('') + '</table></div>';
    document.querySelectorAll('[data-u]').forEach(x => x.onchange = async () => {
      try { await fn('admin-set-role',{id:x.dataset.u, role:x.value}); alert('Rôle modifié'); }
      catch (e) { alert(e.message); }
      accts();
    });
    document.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
      if (!confirm('Supprimer le compte '+b.dataset.e+' ?')) return;
      try { await fn('admin-delete-user',{id:b.dataset.x}); } catch (e) { alert(e.message); }
      accts();
    });
  };
  accts();

  $('#nu').onsubmit = async e => {
    e.preventDefault();
    try { await fn('admin-create-user', Object.fromEntries(new FormData(e.target))); e.target.reset(); alert('Compte créé'); }
    catch (x) { alert(x.message); }
    accts();
  };

  $('#ld').onclick = async () => {
    const { data, error } = await sb.from($('#tb').value).select('*');
    $('#rows').value = error ? error.message : JSON.stringify(data, null, 1);
  };
  $('#sv').onclick = async () => {
    let v;
    try { v = JSON.parse($('#rows').value); } catch { return alert('JSON invalide'); }
    const { error } = await sb.from($('#tb').value).upsert(v);
    alert(error ? error.message : 'Enregistré');
  };
  $('#dl').onclick = async () => {
    const t = $('#tb').value;
    if (!confirm('Supprimer cette ligne ?')) return;
    const { error } = await sb.from(t).delete().eq(t === 'settings' ? 'key' : 'id', $('#delid').value);
    alert(error ? error.message : 'Supprimé');
  };
}

/* === MESSAGERIE === */
async function closGetConversations() {
  const { data, error } = await sb.from('conversations')
    .select('id,customer_id,assigned_to,subject,status,created_at,updated_at')
    .order('updated_at',{ascending:false});
  if (error) throw error;
  return data || [];
}

async function closGetMessages(cid) {
  const { data, error } = await sb.from('messages')
    .select('id,conversation_id,sender_id,body,created_at')
    .eq('conversation_id', cid).order('created_at');
  if (error) throw error;
  return data || [];
}

function closMessageShell(title, conversations) {
  return `<h1>${esc(title)}</h1>
    <div class="card">
      <div class="row" style="align-items:center">
        <div style="flex:1">
          <b>${conversations.length} conversation(s)</b>
          <p class="mut">Messages enregistrés dans votre espace sécurisé.</p>
        </div>
        <button type="button" class="s" id="clos-refresh">Actualiser</button>
      </div>
      <div class="row clos-message-layout" style="align-items:flex-start">
        <aside id="clos-thread-list">
          ${conversations.map(c => `
            <button type="button" data-open-conv="${c.id}">
              <b>${esc(c.subject||'Demande de contact')}</b><br>
              <small class="mut">${esc(c.status||'Ouverte')} · ${dtFull(c.updated_at||c.created_at)}</small>
            </button>`).join('') || '<p class="mut">Aucune conversation pour le moment.</p>'}
        </aside>
        <section id="clos-thread"><p class="mut">Sélectionnez une conversation pour afficher les messages.</p></section>
      </div>
    </div>`;
}

async function closRenderThread(cid, canReply = true) {
  const thread = $('#clos-thread');
  if (!thread) return;
  try {
    const { data:conv, error:ce } = await sb.from('conversations')
      .select('id,subject,status,customer_id,assigned_to').eq('id', cid).single();
    if (ce) throw ce;
    const msgs = await closGetMessages(cid);
    thread.innerHTML = `<h3>${esc(conv.subject||'Discussion')}</h3>
      <p class="mut">Statut : ${esc(conv.status||'ouverte')}</p>
      <div id="clos-message-log" style="max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)">
        ${msgs.map(m => `
          <div style="max-width:88%;margin:8px ${m.sender_id===me.id?'0 0 8px auto':'0 auto 8px 0'};padding:10px 12px;border-radius:12px;background:${m.sender_id===me.id?'#e5efe7':'#fff'}">
            <div>${esc(m.body).replace(/\n/g,'<br>')}</div>
            <small class="mut">${dtFull(m.created_at)} ${m.sender_id===me.id?'· Vous':''}</small>
          </div>`).join('') || '<p class="mut">Aucun message.</p>'}
      </div>
      ${canReply ? `<form id="clos-send-message" style="margin-top:12px">
        <label>Votre message<textarea name="body" rows="3" maxlength="5000" required placeholder="Écrivez votre message…"></textarea></label>
        <button type="submit">Envoyer le message</button>
      </form>` : ''}`;
    const log = $('#clos-message-log');
    if (log) log.scrollTop = log.scrollHeight;
    const form = $('#clos-send-message');
    if (form) form.onsubmit = async e => {
      e.preventDefault();
      const body = new FormData(form).get('body').trim();
      if (!body) return;
      const b = form.querySelector('button');
      b.disabled = true;
      const { error } = await sb.from('messages').insert({ conversation_id:cid, sender_id:me.id, body });
      if (error) { alert('Envoi impossible : ' + error.message); b.disabled = false; return; }
      await sb.from('conversations').update({ updated_at:new Date().toISOString() }).eq('id', cid);
      await closRenderThread(cid, canReply);
    };
  } catch (e) {
    thread.innerHTML = '<div class="card err">Conversation inaccessible : ' + esc(e.message) + '</div>';
  }
}

async function closGetContacts() {
  // Tentative via RPC, sinon fallback direct
  try {
    const { data, error } = await sb.rpc('clos_contact_directory');
    if (error) throw error;
    return (data || []).filter(p => p.id !== me.id);
  } catch {
    // Fallback : liste des vendeurs + (si staff) tous les clients
    const roles = prof?.role === 'client' ? ['seller'] : ['seller','client','admin'];
    const { data, error } = await sb.from('profiles').select('id,prenom,nom,role').in('role', roles);
    if (error) return [];
    return (data || []).filter(p => p.id !== me.id);
  }
}

async function closStartForm() {
  const people = await closGetContacts();
  return `<section class="card">
    <h2>Nouvelle conversation</h2>
    <form id="clos-new-conversation">
      <label>Personne à contacter
        <select name="recipient_id" required>
          <option value="">Choisir un contact…</option>
          ${people.map(p => `<option value="${p.id}">${esc([p.prenom,p.nom].filter(Boolean).join(' ')||p.id)} — ${esc(p.role)}</option>`).join('')}
        </select>
      </label>
      <label>Objet<input name="subject" required maxlength="140" placeholder="Objet de votre message"></label>
      <label>Message<textarea name="body" required maxlength="5000" placeholder="Écrivez votre message…"></textarea></label>
      <button type="submit">Envoyer</button>
    </form>
    ${!people.length ? '<p class="mut">Aucun contact disponible pour le moment.</p>' : ''}
  </section>`;
}

async function closCreateConversation(subject, body, animalId = null, recipientId = null) {
  const role = prof?.role;
  let target = recipientId;
  if (role === 'client') {
    if (!target) throw new Error('Choisissez un vendeur à contacter.');
    const { data:s } = await sb.from('profiles').select('id,role').eq('id', target).single();
    if (!s || s.role !== 'seller') throw new Error('Un client peut uniquement contacter un vendeur.');
  } else if (!['seller','dev','admin'].includes(role)) {
    throw new Error('Votre compte ne peut pas démarrer une conversation.');
  }
  if (!target) throw new Error('Choisissez une personne à contacter.');
  const row = {
    customer_id: role === 'client' ? me.id : target,
    assigned_to: role === 'client' ? target : (role === 'seller' ? me.id : null),
    subject: subject.trim(),
    status: 'ouverte',
    animal_id: animalId
  };
  // Champs optionnels (créés par migration éventuelle)
  if ('created_by' in row || true) row.created_by = me.id;
  if ('recipient_id' in row || true) row.recipient_id = target;
  const { data, error } = await sb.from('conversations').insert(row).select('id').single();
  if (error) throw error;
  const { error: meErr } = await sb.from('messages').insert({ conversation_id:data.id, sender_id:me.id, body:body.trim() });
  if (meErr) throw meErr;
  return data.id;
}

async function renderInbox(title) {
  try {
    const conv = await closGetConversations();
    app.innerHTML = `<h1>${esc(title)}</h1>
      <p class="clos-page-intro">Retrouvez vos échanges, ouvrez une discussion ou démarrez une nouvelle conversation.</p>
      ${await closStartForm()}
      ${closMessageShell('Vos conversations', conv)}`;
    const form = $('#clos-new-conversation');
    if (form) form.onsubmit = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        const id = await closCreateConversation(f.subject, f.body, null, f.recipient_id);
        await renderInbox(title);
        await closRenderThread(id, true);
      } catch (x) { alert(x.message); }
    };
    document.querySelectorAll('[data-open-conv]').forEach(b => b.onclick = () => closRenderThread(b.dataset.openConv, true));
    const r = $('#clos-refresh'); if (r) r.onclick = () => renderInbox(title);
  } catch (e) {
    app.innerHTML = `<h1>${esc(title)}</h1>
      <div class="card err">
        <b>La messagerie n’est pas encore disponible.</b><br>
        ${esc(e.message)}<br><br>
        Vérifiez que les tables <code>conversations</code> et <code>messages</code> existent dans Supabase et que les politiques RLS autorisent la lecture/écriture.
      </div>`;
  }
}

function closMessagesByRole() {
  if (prof?.role === 'dev') return renderInbox('Supervision des échanges');
  if (prof?.role === 'admin') return renderInbox('Messagerie de l’élevage');
  if (prof?.role === 'seller') return renderInbox('Messagerie vendeur');
  return renderInbox('Messagerie client');
}

      sb.from('animals').select('*').eq('seller_id', me.id).order('id'),

      <div class="row">

      </div>

        <h2>Ajouter une annonce</h2>
        <form id="clos-seller-new" class="row">
          <label>Nom<input name="name" required maxlength="60"></label>
          <label>Espèce<input name="sp" required maxlength="60"></label>
          <label>Prix (€)<input name="price" type="number" min="0" step="0.01" required></label>

          <label>Description<textarea name="descr" rows="2"></textarea></label>
          <button type="submit">Créer l’annonce</button>
        </form>
      </div>
      <h2>Mes annonces</h2>
      ${A.map(a => `
        <div class="card">
          <form class="clos-seller-edit" data-id="${a.id}">
            <h3>${esc(a.name)} <span class="tag">${esc(a.status)}</span></h3>
            <div class="row">
              <label>Nom<input name="name" value="${esc(a.name)}" required></label>
              <label>Espèce<input name="sp" value="${esc(a.sp||'')}"></label>
              <label>Prix (€)<input name="price" type="number" min="0" step="0.01" value="${Number(a.price)||0}"></label>
              <label>Statut<select name="status">${ST.map(s => `<option ${s===a.status?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
              <label>Description<textarea name="descr" rows="2">${esc(a.descr||'')}</textarea></label>
            </div>
            <button type="submit">Enregistrer</button>
          </form>
        </div>`).join('') || '<p class="mut">Aucune annonce ne vous est encore attribuée.</p>'}`;
    $('#clos-seller-new').onsubmit = async e => {
      e.preventDefault();

      o.price = Number(o.price);
      o.seller_id = me.id;
      const { error } = await sb.from('animals').insert(o);
      if (error) alert(error.message); else closSeller();
    };
    document.querySelectorAll('.clos-seller-edit').forEach(f => f.onsubmit = async e => {
      e.preventDefault();
      const o = Object.fromEntries(new FormData(f));
      o.price = Number(o.price);
      const { error } = await sb.from('animals').update(o).eq('id', f.dataset.id).eq('seller_id', me.id);
      if (error) alert(error.message); else closSeller();
    });
  } catch (e) {
    app.innerHTML = `<h1>Espace vendeur</h1><div class="card err">Espace vendeur indisponible : ${esc(e.message)}</div>`;
  }
}
