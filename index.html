<!doctype html>

<title>Le Clos des Poils</title>
<style>
:root{--bg:#eef3ec;--card:#fff;--ink:#1f2a24;--mut:#5d6b62;--g:#2f5d43;--a:#e0953a;--line:#d5dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#151c17;--card:#1e2822;--ink:#e8efe9;--mut:#9fb0a5;--g:#3f7a58;--a:#f0b05c;--line:#2e3b33}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 20px;background:var(--g);color:#fff}
header a{color:#fff;text-decoration:none;margin-left:14px}header b{font-size:1.15rem}
main{max-width:860px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
input,select,textarea,button{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:240px}button{background:var(--g);color:#fff;border:0;cursor:pointer}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:#b3382c}
label{display:block;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--a);color:#1f2a24;font-size:.85rem;font-weight:400}
footer{text-align:center;padding:24px;color:var(--mut);font-size:.9rem}footer a{color:var(--mut);margin:0 8px}
.mut{color:var(--mut)}.err{color:#b3382c}:focus-visible{outline:3px solid var(--a);outline-offset:2px}summary{cursor:pointer}

reglement:{t:'Règlement du site',x:`# 1. Objet

async function loadCfg(){const{data}=await sb.from('settings').select('value').eq('key','site_config').maybeSingle();try{CFG={...DEF,...JSON.parse(data?.value||'{}')}}catch{CFG={...DEF}}
if(CFG.elev)ELEV=CFG.elev;if(CFG.acompte!=null)ACOMPTE=+CFG.acompte;if(CFG.payinfo)PAYINFO=CFG.payinfo;if(CFG.contracts)CT=CFG.contracts;if(CFG.careCats)CC=CFG.careCats;if(CFG.statuses)ST=CFG.statuses;
const r=document.documentElement.style;for(const[k,v]of Object.entries(CFG.colors||{}))if(v)r.setProperty('--'+k,v);
let st=$('#cs');if(!st){st=document.createElement('style');st.id='cs';document.head.append(st)}st.textContent=CFG.css||'';
$('#brand').textContent='🐾 '+CFG.name;document.title=CFG.name}
const fmt=x=>x.split('\n\n').map(p=>p.startsWith('# ')?`<h3>${esc(p.slice(2).split('\n')[0])}</h3>${esc(p.split('\n').slice(1).join('\n')).replace(/\n/g,'<br>')}`:`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
async function init(){let bad=0;try{await loadCfg();const{data:{session}}=await sb.auth.getSession();me=session?.user||null;prof=null;if(me){const{data}=await sb.from('profiles').select('*').eq('id',me.id).single();prof=data}}catch(e){bad=1;if(!CFG.name)CFG={...DEF};app.innerHTML='<div class="card err">Erreur de chargement : '+esc(e.message||e)+'</div>'}nav();if(!bad)route()}
sb.auth.onAuthStateChange((ev,sess)=>{const id=sess?.user?.id||null;if(id!==(me?.id||null))setTimeout(init,0)});addEventListener('hashchange',route);
function nav(){$('#nav').innerHTML='<a href="#/">Accueil</a>'+secs('page').map(s=>`<a href="#/p-${esc(s.id)}">${esc(s.title)}</a>`).join('')+(me?`${isA()?'<a href="#/admin-textes">Textes légaux</a>':''}${isD()?'<a href="#/dev">Mode développeur</a>':''}<a href="#/compte">Mon espace</a><a href="#" id="out">Déconnexion</a>`:'<a href="#/compte">Connexion</a>');const o=$('#out');if(o)o.onclick=async e=>{e.preventDefault();await sb.auth.signOut()}}
function route(){const h=location.hash.slice(2);if(DOCS[h])return doc(h);if(h==='compte')return me?(isA()?admin():client()):login();if(h==='admin-textes'&&isA())return textes();if(h==='dev'&&isD())return dev();if(h.startsWith('p-')){const x=secs('page').find(y=>'p-'+y.id===h);if(x){app.innerHTML=`<h1>${esc(x.title)}</h1>${x.html}`;return}}home()}
async function home(){const{data}=await sb.from('animals').select('name,emoji,sp,descr,born,remise,price').eq('status','Disponible');
app.innerHTML=`<h1>${esc(CFG.name)}</h1><p>${esc(CFG.hero)}</p><h2>Disponibles</h2>`+(data?.length?data.map(a=>`<div class="card"><h3>${esc(a.emoji)} ${esc(a.name)} <span class="tag">À l’achat</span></h3><p>${esc(a.sp)} · ${esc(a.descr)} · né(e) le ${dt(a.born)}<br><b>${eur(a.price)}</b></p></div>`).join(''):'<p class="mut">Aucun animal disponible pour le moment.</p>')+'<p><a href="#/compte">Espace acquéreur</a></p>'+secs('home').map(secHtml).join('')}
async function doc(k){const{data}=await sb.from('settings').select('*').eq('key',k).maybeSingle();const ok=data?.validated;
app.innerHTML=`<h1>${DOCS[k].t}</h1>${ok?`<p class="mut">Version validée le ${dt(data.validated_at)}</p>`:'<p class="tag">Brouillon en attente de validation par l’éleveur</p>'}`+fmt(ok?data.value:DOCS[k].x)}
function login(sign){app.innerHTML=`<div class="card"><h2>${sign?'Créer mon compte':'Connexion'}</h2><form id="f">
${sign?'<label>Prénom<input name="prenom" required></label><label>Nom<input name="nom" required></label><label>Téléphone<input name="tel" type="tel"></label>':''}
<label>E-mail<input name="email" type="email" required autocomplete="email"></label>
<label>Mot de passe${sign?' (10 caractères minimum)':''}<input name="pw" type="password" minlength="${sign?10:1}" required autocomplete="${sign?'new-password':'current-password'}"></label>
${sign?'<label><input type="checkbox" name="ok" required> Je suis majeur(e) et j’accepte le <a href="#/reglement" target="_blank">règlement</a> et la <a href="#/confidentialite" target="_blank">politique de confidentialité</a>.</label>':''}
<p id="m" class="err"></p><button>${sign?'Créer mon compte':'Se connecter'}</button> <button type="button" class="s" id="sw">${sign?'J’ai déjà un compte':'Créer un compte'}</button></form></div>`;
$('#sw').onclick=()=>login(!sign);
$('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
const r=sign?await sb.auth.signUp({email:f.email,password:f.pw,options:{data:{prenom:f.prenom,nom:f.nom,tel:f.tel,consent:new Date().toISOString()}}}):await sb.auth.signInWithPassword({email:f.email,password:f.pw});
if(r.error)$('#m').textContent=r.error.message;else if(sign&&!r.data.session)app.innerHTML='<div class="card">Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse, puis connectez-vous.</div>'}}
const careHtml=a=>Object.entries(CC).map(([k,l])=>{const c=a.data?.care?.[k]||[];return c.length?`<h4>${l}</h4>`+c.map(x=>`<div>${esc(x.n)} — ${dt(x.d)}${x.rd?' · rappel le '+dt(x.rd):''}</div>`).join(''):''}).join('')||'<div class="mut">Aucun soin enregistré</div>';
const fill=(t,a)=>t.replace('{eleveur}',ELEV).replace('{acquereur}',prof.prenom+' '+prof.nom).replace(/\{animal\}/g,a.name).replace('{desc}',a.descr||'').replace('{naissance}',dt(a.born)).replace('{remise}',dt(a.remise)).replace('{prix}',eur(a.price)).replace('{acompte}',eur(ACOMPTE));
const fiche=(a,P,S)=>{const p=P.filter(x=>x.animal_id==a.id),paid=p.reduce((s,x)=>s+x.a,0),sg=S.filter(x=>x.animal_id==a.id);
return `<div class="card"><h2>${esc(a.emoji)} ${esc(a.name)} <span class="tag">${esc(a.status)}</span></h2><p>${esc(a.sp)} · ${esc(a.descr)} · né(e) le ${dt(a.born)} · remise prévue le ${dt(a.remise)}</p>
<h3>Paiements</h3>${p.map(x=>`<div>${dt(x.d)} — ${esc(x.l)} : ${eur(x.a)}</div>`).join('')||'<div class="mut">Aucun paiement enregistré</div>'}
<p><b>Prix ${eur(a.price)} · versé ${eur(paid)} · reste ${eur(a.price-paid)}</b></p><p class="mut">Acompte : ${eur(ACOMPTE)} sous 7 jours. ${esc(PAYINFO)}</p>
<h3>Suivi santé</h3>${careHtml(a)}<h3>Contrats</h3>`+CT.map(([k,t,x])=>{const s=sg.find(y=>y.contract_key==k);return `<details><summary>${t} ${s?'✔ signé le '+dt(s.at):''}</summary><p>${esc(fill(x,a)).replace(/\n/g,'<br>')}</p>${s?'':`<form class="sf" data-a="${a.id}" data-k="${k}"><label><input type="checkbox" required> Lu et approuvé</label><label>Nom complet<input required></label><button>Signer</button></form>`}</details>`}).join('')+'</div>'};
async function client(){const{data:A}=await sb.from('animals').select('*').eq('buyer',me.id),ids=(A||[]).map(a=>a.id);
const[{data:P},{data:S}]=ids.length?await Promise.all([sb.from('payments').select('*').in('animal_id',ids).order('d'),sb.from('signatures').select('*').in('animal_id',ids)]):[{data:[]},{data:[]}];

document.querySelectorAll('.sf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('signatures').insert({animal_id:+f.dataset.a,user_id:me.id,contract_key:f.dataset.k,name:f.querySelector('input:not([type=checkbox])').value});error?alert(error.message):client()});
$('#ex').onclick=()=>{const u=document.createElement('a');u.href=URL.createObjectURL(new Blob([JSON.stringify({profil:prof,animaux:A,paiements:P,signatures:S},null,1)],{type:'application/json'}));u.download='mes-donnees.json';u.click()};
$('#del').onclick=async()=>{if(confirm('Supprimer définitivement votre compte ? Les contrats signés peuvent être conservés selon nos obligations légales.')){await sb.rpc('delete_my_account');await sb.auth.signOut();location.hash='#/'}}}
async function admin(){const[{data:A},{data:U},{data:P},{data:S}]=await Promise.all([sb.from('animals').select('*').order('id'),sb.from('profiles').select('id,prenom,nom').eq('role','client'),sb.from('payments').select('*').order('d'),sb.from('signatures').select('*')]);

app.innerHTML=`<h1>Espace éleveur</h1><button id="new">Ajouter un animal</button><br><br>`+A.map(a=>`<details class="card" data-id="${a.id}" ${OPEN==a.id?'open':''}><summary><b>${esc(a.emoji)} ${esc(a.name)}</b> <span class="tag">${esc(a.status)}</span></summary>

<div class="row"><label>Naissance<input type="date" name="born" value="${a.born||''}"></label><label>Remise<input type="date" name="remise" value="${a.remise||''}"></label><label>Prix €<input type="number" name="price" value="${a.price||0}"></label>

<h3>Soins</h3>${careHtml(a)}
<form class="cf"><div class="row"><select name="k">${Object.entries(CC).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input name="n" placeholder="Nom du soin" required><label>Date<input type="date" name="d" required></label><label>Rappel<input type="date" name="rd"></label><button class="s">Ajouter un soin</button></div></form>
<h3>Paiements</h3>${P.filter(x=>x.animal_id==a.id).map(x=>`<div>${dt(x.d)} — ${esc(x.l)} : ${eur(x.a)}</div>`).join('')||'<div class="mut">Aucun</div>'}
<form class="pf"><div class="row"><input name="l" placeholder="Libellé" required><input type="number" step="0.01" name="a" placeholder="Montant €" required><input type="date" name="d" required><button class="s">Enregistrer un paiement</button></div></form>

document.querySelectorAll('.ef').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o.buyer=o.buyer||null;o.price=+o.price;o.born=o.born||null;o.remise=o.remise||null;const{error}=await sb.from('animals').update(o).eq('id',id(f));error?alert(error.message):done(id(f))});

async function textes(){const{data}=await sb.from('settings').select('*'),m=Object.fromEntries((data||[]).map(r=>[r.key,r]));
app.innerHTML='<h1>Textes légaux</h1><p class="mut">Relisez chaque texte, complétez les [crochets], puis validez. Tant qu’un texte n’est pas validé, le brouillon s’affiche avec la mention « en attente de validation ».</p>'+Object.entries(DOCS).map(([k,d])=>`<form class="card" data-k="${k}"><h3>${d.t} ${m[k]?.validated?`<span class="tag">Validé le ${dt(m[k].validated_at)}</span>`:'<span class="tag">À valider</span>'}</h3><textarea name="x">${esc(m[k]?.value||d.x)}</textarea><br><button>Valider et publier</button></form>`).join('');
document.querySelectorAll('form[data-k]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('settings').upsert({key:f.dataset.k,value:f.x.value,validated:true,validated_at:new Date().toISOString(),validated_by:me.id});error?alert(error.message):textes()})}
async function dev(){const c=CFG,col=c.colors||{},D={g:'#2f5d43',a:'#e0953a',bg:'#eef3ec'};
const adv=JSON.stringify({elev:ELEV,acompte:ACOMPTE,payinfo:PAYINFO,contracts:CT,careCats:CC,statuses:ST},null,1);
app.innerHTML=`<h1>Mode développeur</h1><form id="df" class="card"><h3>Site</h3>
<label>Nom du site<input name="name" value="${esc(c.name)}"></label><label>Texte d’accueil<textarea name="hero" style="min-height:70px">${esc(c.hero)}</textarea></label>
<div class="row">${[['g','Couleur principale'],['a','Accent'],['bg','Fond']].map(([k,l])=>`<label>${l}<input type="color" name="c_${k}" value="${col[k]||D[k]}"></label>`).join('')}</div>
<label>CSS personnalisé (libre)<textarea name="css">${esc(c.css)}</textarea></label>
<h3>Sections</h3><p class="mut">Emplacement : home (accueil), client (espace acquéreur) ou page (nouvelle page dans le menu). Contenu en HTML libre.</p>
<div id="secs"></div><button type="button" class="s" id="addsec">Ajouter une section</button>
<h3>Avancé (JSON)</h3><p class="mut">Éleveur, acompte, modes de paiement, textes des contrats, catégories de soins, statuts.</p><textarea name="adv">${esc(adv)}</textarea><br><button>Enregistrer le site</button></form>
<div class="card"><h3>Rôles</h3><div id="roles"></div></div>
<div class="card"><h3>Base de données (accès direct)</h3><div class="row"><select id="tb">${['animals','payments','signatures','profiles','settings'].map(t=>`<option>${t}</option>`).join('')}</select><button class="s" id="ld">Charger</button><button id="sv">Enregistrer (upsert)</button></div><textarea id="rows"></textarea><div class="row"><input id="delid" placeholder="id (ou clé) à supprimer"><button class="d" id="dl">Supprimer</button></div></div>`;
const S=(c.sections||[]).map(x=>({...x})),rs=()=>{$('#secs').innerHTML=S.map((s,i)=>`<div class="card" data-i="${i}"><div class="row"><label>Identifiant<input data-f="id" value="${esc(s.id)}"></label><label>Titre<input data-f="title" value="${esc(s.title)}"></label><label>Emplacement<select data-f="where">${['home','client','page'].map(w=>`<option ${w==s.where?'selected':''}>${w}</option>`).join('')}</select></label><button type="button" class="d" data-rm="${i}">Retirer</button></div><textarea data-f="html">${esc(s.html)}</textarea></div>`).join('');
document.querySelectorAll('#secs [data-f]').forEach(el=>el.oninput=()=>{S[+el.closest('[data-i]').dataset.i][el.dataset.f]=el.value});
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.splice(+b.dataset.rm,1);rs()})};rs();
$('#addsec').onclick=()=>{S.push({id:'section'+(S.length+1),title:'Nouvelle section',where:'home',html:'<p>Contenu…</p>'});rs()};
$('#df').onsubmit=async e=>{e.preventDefault();const f=e.target.elements;let a;try{a=JSON.parse(f.adv.value)}catch{return alert('JSON avancé invalide')}
const colors={};for(const k of['g','a','bg'])if(f['c_'+k].value!==D[k]||col[k])colors[k]=f['c_'+k].value;
const{error}=await sb.from('settings').upsert({key:'site_config',value:JSON.stringify({...a,name:f['name'].value,hero:f.hero.value,css:f.css.value,colors,sections:S}),validated:true,validated_at:new Date().toISOString(),validated_by:me.id});
if(error)alert(error.message);else{await loadCfg();nav();alert('Site enregistré')}};
const{data:U}=await sb.from('profiles').select('id,prenom,nom,email,role');
$('#roles').innerHTML=U.map(u=>`<div class="row"><span>${esc(u.prenom||'')} ${esc(u.nom||'')} (${esc(u.email)})</span><select data-u="${u.id}">${['client','admin','dev'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></div>`).join('');
document.querySelectorAll('[data-u]').forEach(x=>x.onchange=async()=>{const{error}=await sb.from('profiles').update({role:x.value}).eq('id',x.dataset.u);alert(error?error.message:'Rôle modifié')});
$('#ld').onclick=async()=>{const{data,error}=await sb.from($('#tb').value).select('*');$('#rows').value=error?error.message:JSON.stringify(data,null,1)};
$('#sv').onclick=async()=>{let v;try{v=JSON.parse($('#rows').value)}catch{return alert('JSON invalide')}const{error}=await sb.from($('#tb').value).upsert(v);alert(error?error.message:'Enregistré')};
$('#dl').onclick=async()=>{const t=$('#tb').value;if(!confirm('Supprimer cette ligne de '+t+' ?'))return;const{error}=await sb.from(t).delete().eq(t==='settings'?'key':'id',$('#delid').value);alert(error?error.message:'Supprimé')}}
init();
</script></body></html>
