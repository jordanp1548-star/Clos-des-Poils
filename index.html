<style>

*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 20px;background:var(--g);color:#fff}
header a{color:#fff;text-decoration:none;margin-left:14px}header b{font-size:1.15rem}
main{max-width:860px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
input,select,textarea,button{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:240px}button{background:var(--g);color:#fff;border:0;cursor:pointer}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:#b3382c}
label{display:block;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--a);color:#1f2a24;font-size:.85rem;font-weight:400}
footer{text-align:center;padding:24px;color:var(--mut);font-size:.9rem}footer a{color:var(--mut);margin:0 8px}
.mut{color:var(--mut)}.err{color:#b3382c}:focus-visible{outline:3px solid var(--a);outline-offset:2px}summary{cursor:pointer}
@media print {
  header, footer, nav, button, form, .no-print, .sf, .ef, .cf, .pf, .uf, .del-photo, #df, #nu { display: none !important; }
  body { background: #fff; color: #000; }
  main { max-width: 100%; padding: 0; }
  .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; page-break-inside: avoid; }
  details { display: block; }
  summary { font-weight: bold; margin-bottom: 10px; }
}

  <h3>Paiements</h3>${P.filter(x=>x.animal_id==a.id).map(x=>`<div>${dt(x.d)} — ${esc(x.l)} : ${eur(x.a)}</div>`).join('')||'<div class="mut">Aucun</div>'}
  <form class="pf"><div class="row"><input name="l" placeholder="Libellé" required><input type="number" step="0.01" name="a" placeholder="Montant €" required><input type="date" name="d" required><button class="s">Enregistrer un paiement</button></div></form>

const id=el=>+el.closest('[data-id]').dataset.id,done=i=>{OPEN=i;admin()};

document.querySelectorAll('.ef').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o.buyer=o.buyer||null;o.price=+o.price;o.born=o.born||null;o.remise=o.remise||null;const{error}=await sb.from('animals').update(o).eq('id',id(f));error?alert(error.message):done(id(f))});
document.querySelectorAll('.cf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f)),a=A.find(x=>x.id==id(f)),d=a.data||{};d.care=d.care||{};(d.care[o.k]=d.care[o.k]||[]).push({n:o.n,d:o.d,rd:o.rd});const{error}=await sb.from('animals').update({data:d}).eq('id',a.id);error?alert(error.message):done(a.id)});
document.querySelectorAll('.pf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o.a=+o.a;o.animal_id=id(f);const{error}=await sb.from('payments').insert(o);error?alert(error.message):done(o.animal_id)});

document.querySelectorAll('.c-del').forEach(b=>b.onclick=async()=>{
  if(!confirm('Supprimer ce soin ?')) return;
  const el=b.closest('.care-item'), a=A.find(x=>x.id==el.dataset.animal), d=a.data||{};
  if(d.care && d.care[el.dataset.k]){
    d.care[el.dataset.k].splice(el.dataset.i, 1);
    const{error}=await sb.from('animals').update({data:d}).eq('id',a.id);
    error?alert(error.message):done(a.id);
  }
});
document.querySelectorAll('.c-edit').forEach(b=>b.onclick=async()=>{
  const el=b.closest('.care-item'), a=A.find(x=>x.id==el.dataset.animal), d=a.data||{}, k=el.dataset.k, i=el.dataset.i;
  const old=d.care[k][i];
  const n=prompt('Nom du soin :', old.n);
  if(n===null) return;
  const date=prompt('Date du soin (AAAA-MM-JJ) :', old.d);
  if(date===null) return;
  const rd=prompt('Date de rappel (AAAA-MM-JJ, laissez vide si aucun) :', old.rd||'');
  if(rd===null) return;
  d.care[k][i]={n, d:date, rd:rd||null};
  const{error}=await sb.from('animals').update({data:d}).eq('id',a.id);
  error?alert(error.message):done(a.id);
});

document.querySelectorAll('.uf').forEach(f=>f.onsubmit=async e=>{
  e.preventDefault();
  const fileInput = f.querySelector('input[type="file"]');
  const comment = f.querySelector('input[name="comment"]').value;
  const file = fileInput.files[0];
  if(!file) return;
  
  f.querySelector('button').textContent = 'Envoi...';
  const animalId = +f.dataset.id;
  const animal = A.find(x=>x.id==animalId);
  
  const fileName = `${animalId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
  const { error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
  if(uploadError) { alert(uploadError.message); f.querySelector('button').textContent = 'Mettre en ligne'; return; }
  
  const { data: { publicUrl } } = sb.storage.from('photos').getPublicUrl(fileName);
  
  const newPhoto = { url: publicUrl, comment: comment, date: new Date().toISOString() };
  const newPhotos = animal.photos ? [...animal.photos, newPhoto] : [newPhoto];
  
  const { error: updateError } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animalId);
  if(updateError) alert(updateError.message);
  else done(animalId);
});

document.querySelectorAll('.del-photo').forEach(b=>b.onclick=async()=>{
  if(!confirm('Supprimer cette photo ?')) return;
  const animal = A.find(x=>x.id==b.dataset.animal);
  const newPhotos = [...animal.photos];
  newPhotos.splice(b.dataset.i, 1);
  
  const { error } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animal.id);
  if(error) alert(error.message);
  else done(animal.id);
});
}
