<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Clos des Poils</title>
<style>
:root{
  --bg:#f5f5ef;--card:#fff;--ink:#26332b;--mut:#68756c;
  --g:#315b45;--a:#c49a62;--line:#e1e6df;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px clamp(16px,4vw,34px);background:var(--g);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.08)}
header b{font-size:1.12rem;letter-spacing:.02em}
header nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:.94rem}
header a:hover,header a:focus-visible{background:rgba(255,255,255,.14)}
main{width:min(1120px,100%);margin:0 auto;padding:clamp(16px,3vw,30px)}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:.2em 0 .45em}
h2{font-size:1.55rem;margin:1.1em 0 .55em}
h3{font-size:1.15rem;margin:1.1em 0 .55em}
p{margin:.55em 0 1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(15px,2.5vw,22px);margin:0 0 16px;box-shadow:var(--shadow)}
input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input,select,textarea{width:100%;min-width:0}
textarea{min-height:130px;resize:vertical}
button{background:var(--g);color:#fff;border:1px solid var(--g);cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
button:hover{background:#254a36;transform:translateY(-1px)}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}
button.s:hover{background:#edf3ee}
button.d{background:#a83c35;border-color:#a83c35}
label{display:block;margin:9px 0;min-width:170px;flex:1}
label input,label select,label textarea{display:block;margin-top:5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#edf2ed;color:var(--g);font-size:.82rem;font-weight:650}
footer{text-align:center;padding:28px 16px;color:var(--mut);font-size:.9rem}
footer a{color:var(--mut);margin:0 8px}
.mut{color:var(--mut)}.err{color:#a8322a}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
summary{cursor:pointer;font-weight:650}
details[open]>summary{margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line)}
table{font-size:.94rem}th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
img{max-width:100%}
@media(max-width:650px){
  header{align-items:flex-start}
  header nav{width:100%;gap:3px}
  header a{margin:0;padding:7px 8px;font-size:.88rem}
  main{padding:15px}
  .row>*{flex:1 1 100%}
  .card{border-radius:13px}
}
@page{size:A4;margin:16mm}
@media print{
  body{background:#fff!important;color:#202820!important;font-size:10.5pt}
  header,footer,nav,button,form,.no-print,.sf,.ef,.cf,.pf,.uf,.del-photo,#df,#nu,.admin-only{display:none!important}
  main{width:100%;max-width:none;padding:0;margin:0}
  .card{border:0;box-shadow:none;border-radius:0;padding:0;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}
  details{display:block}
  details>summary{display:none}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;break-inside:avoid}
  h1,h2,h3,h4{break-after:avoid}
}
</style></head><body>

const DOCS={
reglement:{t:'Règlement du site',x:`# 1. Objet
Ce site permet aux acquéreurs de suivre l’animal réservé auprès de {{nom}}. Il ne remplace pas le contrat de vente.

{{nom}}, {{adresse}}, {{email}}.

Identité (prénom, nom), e-mail, téléphone, données de réservation et de suivi de l’animal, paiements enregistrés, signatures électroniques horodatées, date d’acceptation du règlement.

Gérer votre compte et la réservation (exécution du contrat) ; respecter les obligations comptables et légales ; assurer la sécurité du site (intérêt légitime).

Compte : durée de la relation puis {{duree_compte}}. Contrats et paiements : {{duree_contrats}}. Après suppression du compte, les contrats signés peuvent être conservés pour ces durées.

L’éleveur, et nos prestataires techniques : {{hebergeur}}, Supabase, {{service_email}}. Transferts hors UE : {{transferts}}.

let me=null,prof=null,OPEN=null,CFG={};

async function fn(name,body){const{data,error}=await sb.functions.invoke(name,{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch{}throw new Error(m)}return data}

  if(error){app.innerHTML=`<div class="card err">Impossible de charger les annonces : ${esc(error.message)}</div>`;return;}
  const annonces=(data||[]).map(a=>{
    const photos=a.photos||[],photo=photos.length?photos[photos.length-1]:null,r=a.data?.profile||{};

const fill=(t,a)=>t.replace('{eleveur}',ELEV).replace('{acquereur}',prof.prenom+' '+prof.nom).replace(/\{animal\}/g,a.name).replace('{desc}',a.descr||'').replace('{naissance}',dd(a.born)).replace('{remise}',dd(a.remise)).replace('{prix}',eur(a.price)).replace('{acompte}',eur(ACOMPTE));
const fiche=(a,P,S)=>{
  const p=P.filter(x=>x.animal_id==a.id),paid=p.reduce((s,x)=>s+x.a,0),sg=S.filter(x=>x.animal_id==a.id);
  const photos = a.photos || [];
  const lastPhoto = photos.length > 0 ? photos[photos.length - 1] : null;
  
  const galerie = photos.length > 0 ? photos.map((ph, i) => `
    <div style="margin-bottom:15px; border:1px solid var(--line); padding:10px; border-radius:8px;">
      <img src="${esc(ph.url)}" style="max-width:100%; border-radius:8px; max-height:300px; object-fit:cover;" alt="Photo">
      <p style="margin:8px 0 0 0;"><b>${dt(ph.date)}</b> — ${esc(ph.comment)}</p>
      ${i === photos.length - 1 ? '<span class="tag" style="margin-left:10px">Photo de profil actuelle</span>' : ''}
    </div>
  `).join('') : '<p class="mut">Aucune photo pour le moment.</p>';

  return `<div class="card">
    <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
      ${lastPhoto ? `<img src="${esc(lastPhoto.url)}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--g);">` : '<div style="width:100px;height:100px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;">Aucune photo</div>'}
      <div>
        <h2 style="margin:0">${esc(a.name)} <span class="tag">${esc(a.status)}</span></h2>
        <p style="margin:4px 0 0 0">${esc(a.sp)} · né(e) le ${dt(a.born)}</p>
      </div>
      <button type="button" class="s no-print" data-print-animal="${a.id}" style="margin-left:auto">Télécharger / imprimer la fiche</button>
    </div>
    
    ${(()=>{const r=a.data?.profile||{};return `<h3>Informations complémentaires</h3><div class="row"><span><b>Race :</b> ${esc(r.race||'Non renseignée')}</span><span><b>Sexe :</b> ${esc(a.sex||'Non renseigné')}</span><span><b>Couleur :</b> ${esc(r.couleur||'Non renseignée')}</span><span><b>Poids :</b> ${esc(r.poids||'Non renseigné')}</span></div><p><b>Identification :</b> ${r.identifie==='Oui'?'Identifié — '+esc(r.identification_type||'Type non précisé')+' n° '+esc(r.identification_numero||'Non renseigné'):'Non identifié'}</p>${r.disponibilite_prevue?`<p><b>Date de disponibilité estimée :</b> ${dt(r.disponibilite_prevue)}</p>`:''}${r.disponibilite_reelle?`<p><b>Date de disponibilité confirmée :</b> ${dt(r.disponibilite_reelle)}</p>`:''}${r.depart_prevu?`<p><b>Date de départ prévue :</b> ${dt(r.depart_prevu)}</p>`:''}${(r.numero_portee||r.date_saillie||r.date_mise_bas||r.petits_nes||r.origines_portee)?`<h3>Informations sur la portée</h3><p>${r.numero_portee?' <b>Portée :</b> '+esc(r.numero_portee):''}${r.pere_portee?' · <b>Père :</b> '+esc(r.pere_portee):''}${r.mere_portee?' · <b>Mère :</b> '+esc(r.mere_portee):''}</p>${r.date_saillie?`<p><b>Date de saillie :</b> ${dt(r.date_saillie)}</p>`:''}${r.mise_bas_prevue?`<p><b>Mise bas prévue :</b> ${dt(r.mise_bas_prevue)}</p>`:''}${r.date_mise_bas?`<p><b>Date de mise bas :</b> ${dt(r.date_mise_bas)}</p>`:''}<p><b>Petits nés :</b> ${esc(r.petits_nes??'—')} · <b>Vivants à la naissance :</b> ${esc(r.petits_vivants??'—')} · <b>Morts-nés :</b> ${esc(r.morts_nes??'—')} · <b>Vivants à 48 h :</b> ${esc(r.petits_48h??'—')} · <b>Sevrés :</b> ${esc(r.petits_sevres??'—')}</p>${r.date_sevrage?`<p><b>Date de sevrage :</b> ${dt(r.date_sevrage)}</p>`:''}${r.poids_naissance?`<p><b>Poids moyen à la naissance :</b> ${esc(r.poids_naissance)}</p>`:''}${r.poids_portee?`<p><b>Poids au dernier contrôle :</b> ${esc(r.poids_portee)}</p>`:''}${r.deroulement_portee?`<p><b>Déroulement :</b> ${esc(r.deroulement_portee)}</p>`:''}${r.origines_portee?`<p><b>Suivi de la portée :</b> ${esc(r.origines_portee)}</p>`:''}`:''}${r.caractere?`<p><b>Caractère :</b> ${esc(r.caractere)}</p>`:''}${r.habitudes?`<p><b>Habitudes :</b> ${esc(r.habitudes)}</p>`:''}${r.alimentation?`<p><b>Alimentation :</b> ${esc(r.alimentation)}</p>`:''}${r.notes_sante?`<p><b>Observations santé :</b> ${esc(r.notes_sante)}</p>`:''}</div>`})()}
    <h3>Actualités en photos</h3>
    ${galerie}
    
    <hr style="margin:20px 0; border:0; border-top:1px solid var(--line)">
    
    <h3>Paiements</h3>${p.map(x=>`<div>${dt(x.d)} — ${esc(x.l)} : ${eur(x.a)}</div>`).join('')||'<div class="mut">Aucun paiement enregistré</div>'}
    <p><b>Prix ${eur(a.price)} · versé ${eur(paid)} · reste ${eur(a.price-paid)}</b></p><p class="mut">Acompte : ${eur(ACOMPTE)} sous 7 jours. ${esc(PAYINFO)}</p>
    
    <h3>Suivi santé</h3>${careHtml(a)}
    
    <h3>Contrats</h3>`+CT.map(([k,t,x])=>{const s=sg.find(y=>y.contract_key==k);return `<details><summary>${t} ${s?'✔ signé le '+dt(s.at):''}</summary><p>${esc(fill(x,a)).replace(/\n/g,'<br>')}</p>${s?'':`<form class="sf" data-a="${a.id}" data-k="${k}"><label><input type="checkbox" required> Lu et approuvé</label><label>Nom complet<input required></label><button>Signer</button></form>`}</details>`}).join('')+'</div>'};

function printAnimalSheet(a,P=[],S=[]){
  const profile=a.data?.profile||{};
  const payments=P.filter(x=>x.animal_id==a.id);
  const paid=payments.reduce((sum,x)=>sum+(Number(x.a)||0),0);
  const photos=a.photos||[];
  const care=a.data?.care||{};
  const pdfCfg=CFG.pdf||{};
  const value=(v)=>v!==undefined&&v!==null&&String(v).trim()!==''?esc(v):'';
  const field=(label,v)=>value(v)?`<div class="field"><strong>${label}</strong><span>${value(v)}</span></div>`:'';
  const section=(title,content)=>content?`<section><h2>${title}</h2>${content}</section>`:'';
  const careHtml=Object.entries(CC).map(([key,label])=>{
    const entries=care[key]||[];
    if(!entries.length)return '';
    return `<h3>${esc(label)}</h3><ul>${entries.map(x=>`<li>${esc(x.n||'')} — ${dt(x.d)}${x.rd?' · Rappel : '+dt(x.rd):''}</li>`).join('')}</ul>`;
  }).join('');
  const gallery=photos.length?`<div class="gallery">${photos.map(ph=>`<figure><img src="${esc(ph.url)}" alt="Photographie de ${esc(a.name)}"><figcaption>${dt(ph.date)}${ph.comment?' — '+esc(ph.comment):''}</figcaption></figure>`).join('')}</div>`:'<p>Aucune photographie enregistrée.</p>';
  const htmlDoc=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche de ${esc(a.name)} - ${esc(CFG.name||'Le Clos des Poils')}</title>
  <style>
  @page{size:A4;margin:15mm}*{box-sizing:border-box}body{font:10.5pt/1.5 Arial,sans-serif;color:#26332b;margin:0}
  header{border-bottom:3px solid #315b45;padding-bottom:12px;margin-bottom:18px}
  .brand{font-size:18pt;font-weight:700;color:#315b45}.sub{color:#68756c;font-size:9pt}
  h1{font-size:23pt;margin:8px 0 3px}h2{font-size:14pt;color:#315b45;border-bottom:1px solid #dfe6df;padding-bottom:5px;margin:18px 0 8px}
  h3{font-size:11pt;margin:10px 0 4px}p{margin:4px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
  .field{padding:3px 0;border-bottom:1px dotted #d9dfd9}.field strong{display:block;font-size:8.5pt;color:#68756c}
  .hero{display:flex;gap:18px;align-items:center;margin:12px 0}.hero img{width:118px;height:118px;object-fit:cover;border-radius:10px}
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gallery figure{margin:0;break-inside:avoid}.gallery img{width:100%;height:190px;object-fit:cover;border-radius:7px}.gallery figcaption{font-size:8.5pt;color:#68756c;margin-top:3px}
  ul{margin:4px 0 8px;padding-left:20px}footer{margin-top:24px;border-top:1px solid #dfe6df;padding-top:8px;color:#68756c;font-size:8pt}
  .note{font-size:8.5pt;color:#68756c}
  </style></head><body>
  <header><div class="brand">${esc(pdfCfg.title||CFG.name||'Le Clos des Poils')}</div><div class="sub">${esc(pdfCfg.subtitle||'Fiche individuelle de suivi')}</div></header>
  <div class="hero">${photos.length?`<img src="${esc(photos[photos.length-1].url)}" alt="">`:''}<div><h1>${esc(a.name)}</h1><div>${esc(a.sp||'')} ${a.sex?'· '+esc(a.sex):''} ${a.status?'· '+esc(a.status):''}</div><div class="sub">Document généré le ${new Date().toLocaleDateString('fr-FR')}</div></div></div>
  ${section('Identification',`<div class="grid">${field('Espèce',a.sp)}${field('Race',profile.race)}${field('Sexe',a.sex)}${field('Couleur / robe',profile.couleur)}${field('Date de naissance',dt(a.born))}${field('Poids actuel',profile.poids)}${field('Identification',profile.identifie==='Oui'?(profile.identification_type||'')+' '+(profile.identification_numero||''):'Non renseigné')}</div>`)}
  ${section('Origines et portée',`<div class="grid">${field('Référence de portée',profile.numero_portee)}${field('Père',profile.pere_portee||profile.pere)}${field('Mère',profile.mere_portee||profile.mere)}${field('Date de saillie',dt(profile.date_saillie))}${field('Date de mise bas',dt(profile.date_mise_bas))}${field('Nombre de petits nés',profile.petits_nes)}${field('Petits vivants à la naissance',profile.petits_vivants)}${field('Petits sevrés',profile.petits_sevres)}${field('Date de sevrage',dt(profile.date_sevrage))}</div>${field('Observations sur la portée',profile.deroulement_portee)}${field('Suivi de la portée',profile.origines_portee)}`)}
  ${section('Développement et comportement',`${field('Caractère',profile.caractere)}${field('Habitudes et socialisation',profile.habitudes)}${field('Alimentation actuelle',profile.alimentation)}${field('Conseils particuliers',profile.conseils)}`)}
  ${section('Suivi sanitaire',`${field('Dernier contrôle vétérinaire',dt(profile.dernier_controle))}${field('Antécédents / traitements',profile.antecedents)}${field('Observations de santé',profile.notes_sante)}${careHtml||'<p>Aucun soin enregistré.</p>'}`)}
  ${section('Réservation et paiements',`<div class="grid">${field('Disponibilité prévue',dt(profile.disponibilite_prevue))}${field('Disponibilité confirmée',dt(profile.disponibilite_reelle))}${field('Date de réservation',dt(profile.date_reservation))}${field('Date de remise prévue',dt(a.remise))}${field('Prix de vente',eur(a.price))}${field('Total versé',eur(paid))}${field('Solde restant',eur((Number(a.price)||0)-paid))}</div>${payments.length?'<h3>Historique des paiements</h3><ul>'+payments.map(x=>`<li>${dt(x.d)} — ${esc(x.l||'Paiement')} : ${eur(x.a)}</li>`).join('')+'</ul>':'<p>Aucun paiement enregistré.</p>'}`)}
  ${section('Photographies',gallery)}
  <footer>${esc(pdfCfg.footer||'Document de suivi édité par l’éleveur. Il ne remplace pas les documents vétérinaires ou officiels.')}</footer>
  <script>window.addEventListener('load',()=>{const imgs=[...document.images];Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>setTimeout(()=>window.print(),250));});<\/script>
  </body></html>`;
  const win=window.open('','_blank');
  if(!win){alert('Autorisez les fenêtres contextuelles pour générer le document.');return;}
  win.document.open();win.document.write(htmlDoc);win.document.close();
}

async function client(){const{data:A}=await sb.from('animals').select('*').eq('buyer',me.id),ids=(A||[]).map(a=>a.id);
const[{data:P},{data:S}]=ids.length?await Promise.all([sb.from('payments').select('*').in('animal_id',ids).order('d'),sb.from('signatures').select('*').in('animal_id',ids)]):[{data:[]},{data:[]}];
app.innerHTML=`<h1>Bonjour ${esc(prof.prenom)}</h1>`+(A?.length?A.map(a=>fiche(a,P,S)).join(''):'<p class="mut">Aucun animal n’est encore rattaché à votre compte. L’éleveur le fera après votre réservation.</p>')+secs('client').map(secHtml).join('')+'<div class="card"><h3>Mes données</h3><button class="s" id="ex">Télécharger mes données</button> <button class="d" id="del">Supprimer mon compte</button></div>';
document.querySelectorAll('[data-print-animal]').forEach(b=>b.onclick=()=>{const animal=A.find(x=>x.id==b.dataset.printAnimal);if(animal)printAnimalSheet(animal,P,S)});
document.querySelectorAll('.sf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('signatures').insert({animal_id:+f.dataset.a,user_id:me.id,contract_key:f.dataset.k,name:f.querySelector('input:not([type=checkbox])').value});error?alert(error.message):(alert('Contrat signé ✔'),client())});
$('#ex').onclick=()=>{const u=document.createElement('a');u.href=URL.createObjectURL(new Blob([JSON.stringify({profil:prof,animaux:A,paiements:P,signatures:S},null,1)],{type:'application/json'}));u.download='mes-donnees.json';u.click()};
$('#del').onclick=async()=>{if(confirm('Supprimer définitivement votre compte ? Les contrats signés peuvent être conservés selon nos obligations légales.')){const{error}=await sb.rpc('delete_my_account');if(error){alert(error.message);return}await sb.auth.signOut();location.hash='#/'}}}

document.querySelectorAll('.c-edit').forEach(b=>b.onclick=async()=>{
  const el=b.closest('.care-item'), a=A.find(x=>x.id==el.dataset.animal), d=a.data||{}, k=el.dataset.k, i=el.dataset.i;
  const old=d.care[k][i];
  const n=prompt('Nom du soin :', old.n);
  if(n===null) return;
  const date=prompt('Date du soin (AAAA-MM-JJ) :', old.d);
  if(date===null) return;
  const rd=prompt('Date de rappel (AAAA-MM-JJ, laissez vide si aucun) :', old.rd||'');
  if(rd===null) return;
  d.care[k][i]={n, d:date, rd:rd||null};
  const{error}=await sb.from('animals').update({data:d}).eq('id',a.id);
  error?alert(error.message):done(a.id);
});

document.querySelectorAll('.uf').forEach(f=>f.onsubmit=async e=>{
  e.preventDefault();
  const fileInput = f.querySelector('input[type="file"]');
  const comment = f.querySelector('input[name="comment"]').value;
  const file = fileInput.files[0];
  if(!file) return;
  
  f.querySelector('button').textContent = 'Envoi...';
  const animalId = +f.dataset.id;
  const animal = A.find(x=>x.id==animalId);
  
  const fileName = `${animalId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
  const { error: uploadError } = await sb.storage.from('photos').upload(fileName, file);
  if(uploadError) { alert(uploadError.message); f.querySelector('button').textContent = 'Mettre en ligne'; return; }
  
  const { data: { publicUrl } } = sb.storage.from('photos').getPublicUrl(fileName);
  
  const newPhoto = { url: publicUrl, comment: comment, date: new Date().toISOString() };
  const newPhotos = animal.photos ? [...animal.photos, newPhoto] : [newPhoto];
  
  const { error: updateError } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animalId);
  if(updateError) alert(updateError.message);
  else done(animalId);
});

document.querySelectorAll('.del-photo').forEach(b=>b.onclick=async()=>{
  if(!confirm('Supprimer cette photo ?')) return;
  const animal = A.find(x=>x.id==b.dataset.animal);
  const newPhotos = [...animal.photos];
  newPhotos.splice(b.dataset.i, 1);
  
  const { error } = await sb.from('animals').update({ photos: newPhotos }).eq('id', animal.id);
  if(error) alert(error.message);
  else done(animal.id);
});
}
